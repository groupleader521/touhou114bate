l_english:
 makai_infantry_equipment_1:0 "Makai Infantry Equipment I"
 makai_infantry_equipment_1_short:0 "Makai Infantry Equipment I"
 makai_infantry_equipment_1_desc:0 "Personal and crew served weapons for infantry as well as the various other bits of kit a soldier needs."
 makai_artillery_equipment_1:0 "Makai Towed Artillery"
 makai_artillery_equipment_1_short:0 "Makai Towed Artillery"
 makai_artillery_equipment_1_desc:0 "Artillery refers to large-caliber weapons, such as cannons and howitzers that are operated by crews, which can project munitions far beyond the effective range of personal weapons."
 makai_anti_air_equipment_1:0 "Makai Towed Anti-Aircraft"
 makai_anti_air_equipment_1_short:0 "Makai Towed Anti-Aircraft"
 makai_anti_air_equipment_1_desc:0 "Anti-aircraft artillery is primarily designed to shoot down hostile planes, although the rapid-fire cannons can also be effective against ground targets."
 makai_anti_tank_equipment_1:0 "Makai Towed Anti-Tank"
 makai_anti_tank_equipment_1_short:0 "Makai Towed Anti-Tank"
 makai_anti_tank_equipment_1_desc:0 "A direct-fire artillery piece firing armor-piercing ammunition to destroy tanks and other hard targets."
 makai_support_equipment_1:0 "Makai Support Equipment"
 makai_support_equipment_1_short:0 "Makai Support Equipment"
 makai_support_equipment_1_desc:0 "Radios, Jeeps, Pontoons & other equipment used to support troops."
 makai_motorized_equipment_1:0 "Makai Truck"
 makai_motorized_equipment_1_short:0 "Makai Truck"
 makai_motorized_equipment_1_desc:0 "Motorizing infantry is the first stage towards the mechanization of an army. Civilian trucks are readily adaptable to military uses of transporting soldiers, towing guns, and carrying equipment and supplies. This greatly increases the strategic mobility of infantry units, which would otherwise rely on marching."
 makai_fighter_equipment_1:0 "Makai Fighter I"
 makai_fighter_equipment_1_short:0 "Makai Fighter I"
 makai_fighter_equipment_1_desc:0 "Light airframes have been revolutionized with the introduction of radial engines, monoplane designs and all metal skin construction. This design is our attempt at creating our first modern fighter plane."
 makai_cv_fighter_equipment_1:0 "Makai Carrier Fighter I"
 makai_cv_fighter_equipment_1_short:0 "Makai Carrier Fighter I"
 makai_cv_fighter_equipment_1_desc:0 "An early fighter modified to launch from and land on aircraft carriers."
 makai_cas_equipment_1:0 "Makai Close Air Support I"
 makai_cas_equipment_1_short:0 "Makai Close Air Support I"
 makai_cas_equipment_1_desc:0 "Our CAS doctrine requires an aircraft capable of precision surface attack. While these aircraft carry a lesser payload compared to our larger Tactical Bombers, they are capable of attacking and destroying small targets of opportunity through strafing and dive bombing."
 makai_cv_cas_equipment_1:0 "Makai Carrier Close Air Support I"
 makai_cv_cas_equipment_1_short:0 "Makai Carrier Close Air Support I"
 makai_cv_cas_equipment_1_desc:0 "An early close air support plane modified to launch from and land on aircraft carriers."
 makai_nav_bomber_equipment_1:0 "Makai Naval Bomber I"
 makai_nav_bomber_equipment_1_short:0 "Makai Naval Bomber I"
 makai_nav_bomber_equipment_1_desc:0 "Naval aviation will be vital in the coming decade to confront new developments in naval warfare, such as the increased importance of submarines. Seaplanes with capacity to work as dive bombers and recon vehicles will be of use."
 makai_cv_nav_bomber_equipment_1:0 "Makai Carrier Naval Bomber I"
 makai_cv_nav_bomber_equipment_1_short:0 "Makai Carrier Naval Bomber I"
 makai_cv_nav_bomber_equipment_1_desc:0 "An early naval bomber modified to launch from and land on aircraft carriers."
 makai_heavy_fighter_equipment_1:0 "Makai Heavy Fighter I"
 makai_heavy_fighter_equipment_1_short:0 "Makai Heavy Fighter I"
 makai_heavy_fighter_equipment_1_desc:0 "Our bomber force needs escort protection from enemy fighters all the way to their targets and back. In order to provide this escort, we must design fighter aircraft with bomber range. Out of necessity these aircraft are larger, slower and less agile than light fighters, though they can carry significant armament."
 makai_tac_bomber_equipment_1:0 "Makai Tactical Bomber I"
 makai_tac_bomber_equipment_1_short:0 "Makai Tactical Bomber I"
 makai_tac_bomber_equipment_1_desc:0 "Medium bombers need to be versatile and fast, capable of fulfilling a range of roles. A twin-engined design, remaining relatively light, can continue to be of use for many years to come."
 makai_strat_bomber_equipment_1:0 "Makai Strategic Bomber I"
 makai_strat_bomber_equipment_1_short:0 "Makai Strategic Bomber I"
 makai_strat_bomber_equipment_1_desc:0 "Experiences from the Great War and studies since show that bombing the enemy's military targets and major cities will win the next war. At the very least, we must have a bomber capable of delivering such destruction. It will need to fly high and at good speed, and it must carry a large payload. This will require a large airframe with multiple engines. It will also have some defensive capability."
 makai_destroyer_4:0 "Makai Destroyer IV"
 makai_destroyer_4_short:0 "Makai Destroyer IV"
 makai_destroyer_4_desc:0 "The modern destroyer must be fitted with a variety of different detection technologies, new depth charge deployment systems and be built at a larger scale than their predecessors."
 makai_light_cruiser_4:0 "Makai Light Cruiser IV"
 makai_light_cruiser_4_short:0 "Makai Light Cruiser IV"
 makai_light_cruiser_4_desc:0 "Tactically employed to protect larger ships, the modern generation of light cruisers can shake off most past restrictions and be better armed to handle aerial attacks."
 makai_heavy_cruiser_4:0 "Makai Heavy Cruiser IV"
 makai_heavy_cruiser_4_short:0 "Makai Heavy Cruiser IV"
 makai_heavy_cruiser_4_desc:0 "Upscaled, longer and heavier designs with rapid-fire armaments are features in these final stages of heavy cruiser development."
 makai_battleship_4:0 "Makai Battleship IV"
 makai_battleship_4_short:0 "Makai Battleship IV"
 makai_battleship_4_desc:0 "As the world sees what may be the last major battleship confrontations, the importance of heavy armaments and anti-air turrets is greater than ever."
 makai_carrier_4:0 "Makai Carrier IV"
 makai_carrier_4_short:0 "Makai Carrier IV"
 makai_carrier_4_desc:0 "With many naval treaties now increasingly ignored, we can proceed to build carriers capable of transporting more planes than ever to secure air superiority cover."
 makai_submarine_4:0 "Makai Submarine IV"
 makai_submarine_4_short:0 "Makai Submarine IV"
 makai_submarine_4_desc:0 "Increased test depth and efficient layouts will be features of the modern submarines, taking advantage of field experience to select appropriate armaments and engines."
 makai_super_heavy_tank_equipment_1:0 "Makai Super Heavy Tank"
 makai_super_heavy_tank_equipment_1_short:0 "Makai Super Heavy Tank"
 makai_super_heavy_tank_equipment_1_desc:0 "Super heavy tanks are an evolution of the heavy tank concept. Bigger, better armed, with more armor, they are also slower and have severe problems with soft ground. Few bridges can hope to handle their weight."
 makai_super_heavy_tank_destroyer_equipment_1:0 "Makai Super Heavy SP Tank Destroyer"
 makai_super_heavy_tank_destroyer_equipment_1_short:0 "Makai Super Heavy SP Tank Destroyer"
 makai_super_heavy_tank_destroyer_equipment_1_desc:0 "A super-heavy tank chassis with an even larger gun in a fixed mount instead of a turret."
 makai_super_heavy_tank_artillery_equipment_1:0 "Makai Super Heavy SP Artillery"
 makai_super_heavy_tank_artillery_equipment_1_short:0 "Makai Super Heavy SP Artillery"
 makai_super_heavy_tank_artillery_equipment_1_desc:0 "Massive artillery cannons mounted on a super-heavy chassis."
 makai_super_heavy_tank_aa_equipment_1:0 "Makai Super-Heavy SP Anti-Air"
 makai_super_heavy_tank_aa_equipment_1_short:0 "Makai Super-Heavy SP Anti-Air"
 makai_super_heavy_tank_aa_equipment_1_desc:0 "Super-heavy tank chassis with anti-aircraft armament."
 makai_fighter_equipment_2:0 "Makai Fighter II"
 makai_fighter_equipment_2_short:0 "Makai Fighter II"
 makai_fighter_equipment_2_desc:0 "The pace of fighter advancements is astounding, and as such, we must continue to incorporate the technology as well as improve upon existing concepts. Our new fighter design must be capable of high speed, high performance at altitude and the best range possible. Additionally, it must be very well armed."
 makai_cv_fighter_equipment_2:0 "Makai Carrier Fighter II"
 makai_cv_fighter_equipment_2_short:0 "Makai Carrier Fighter II"
 makai_cv_fighter_equipment_2_desc:0 "An improved fighter modified to launch from and land on aircraft carriers."
 makai_cas_equipment_2:0 "Makai Close Air Support II"
 makai_cas_equipment_2_short:0 "Makai Close Air Support II"
 makai_cas_equipment_2_desc:0 "Early war experiences have shown that increased speed, armor and maneuverability are necessary for CAS aircraft survivability against enemy fighters and ground fire. This next generation of ground attack aircraft will also utilize larger bombs, cannons and machineguns to inflict greater damage to their targets."
 makai_cv_cas_equipment_2:0 "Makai Carrier Close Air Support II"
 makai_cv_cas_equipment_2_short:0 "Makai Carrier Close Air Support II"
 makai_cv_cas_equipment_2_desc:0 "An improved close air support plane modified to launch from and land on aircraft carriers."
 makai_nav_bomber_equipment_2:0 "Makai Naval Bomber II"
 makai_nav_bomber_equipment_2_short:0 "Makai Naval Bomber II"
 makai_nav_bomber_equipment_2_desc:0 "New engine technology and aerodynamically refined designs will boost the speed and diving attack capability of naval planes significantly."
 makai_cv_nav_bomber_equipment_2:0 "Makai Carrier Naval Bomber II"
 makai_cv_nav_bomber_equipment_2_short:0 "Makai Carrier Naval Bomber II"
 makai_cv_nav_bomber_equipment_2_desc:0 "An improved naval bomber modified to launch from and land on aircraft carriers."
 makai_heavy_fighter_equipment_2:0 "Makai Heavy Fighter II"
 makai_heavy_fighter_equipment_2_short:0 "Makai Heavy Fighter II"
 makai_heavy_fighter_equipment_2_desc:0 "The war has taught us that our heavy fighter design is vulnerable to more nimble fighters, but quite good at the interception of enemy bombers due to heavy armament. This next design will focus on increased attack capability against enemy aircraft and even ground targets. Its speed and range will be improved as well."
 makai_tac_bomber_equipment_2:0 "Makai Tactical Bomber II"
 makai_tac_bomber_equipment_2_short:0 "Makai Tactical Bomber II"
 makai_tac_bomber_equipment_2_desc:0 "Heavier designs of tactical bombers can extend range, payload and speed while maintaining the planes' capacity to perform a wide variety of missions."
 makai_strat_bomber_equipment_2:0 "Makai Strategic Bomber II"
 makai_strat_bomber_equipment_2_short:0 "Makai Strategic Bomber II"
 makai_strat_bomber_equipment_2_desc:0 "Bombing has proven effective at reducing the enemy's capacity to wage war. More defensive weaponry and increased speed will allow a new design to avoid destruction, while increasing the payload and range will make it more effective."
 makai_infantry_equipment_2:0 "Makai Infantry Equipment II"
 makai_infantry_equipment_2_short:0 "Makai Infantry Equipment II"
 makai_infantry_equipment_2_desc:0 "Personal and crew served weapons for infantry as well as the various other bits of kit a soldier needs. Modernized to include a great number of sub-machineguns and anti-tank rifles."
 makai_artillery_equipment_2:0 "Makai Improved Artillery"
 makai_artillery_equipment_2_short:0 "Makai Improved Artillery"
 makai_artillery_equipment_2_desc:0 "New howitzer designs, taking advantage of new hydraulic recoil devices and longer barrels."
 makai_anti_air_equipment_2:0 "Makai Improved Anti-Air"
 makai_anti_air_equipment_2_short:0 "Makai Improved Anti-Air"
 makai_anti_air_equipment_2_desc:0 "Anti-air guns with longer cartridges and barrels, able to target high-flying aircraft."
 makai_anti_tank_equipment_2:0 "Makai Improved Anti-Tank"
 makai_anti_tank_equipment_2_short:0 "Makai Improved Anti-Tank"
 makai_anti_tank_equipment_2_desc:0 "Larger caliber guns to combat heavier tanks with sloped armor."
 makai_mechanized_equipment_2:0 "Makai Mechanized Equipment II"
 makai_mechanized_equipment_2_short:0 "Makai Mechanized Equipment II"
 makai_mechanized_equipment_2_desc:0 "Mechanized infantry are equipped with armored personnel carriers (APCs) or infantry fighting vehicles (IFVs) for transport and combat. Mechanized infantry is distinguished from motorized infantry in that its vehicles provide a degree of protection from hostile fire, as opposed to soft-skinned wheeled vehicles (trucks or jeeps) for motorized infantry."
 makai_modern_tank_equipment_1:0 "Makai Modern Tank"
 makai_modern_tank_equipment_1_short:0 "Makai Modern Tank"
 makai_modern_tank_equipment_1_desc:0 "Modern tanks are agile, multi-purpose AFVs which combine heavy tank firepower with the mobility of a medium tank, prefiguring modern MBTs."
 makai_modern_tank_destroyer_equipment_1:0 "Makai Modern Tank Destroyer"
 makai_modern_tank_destroyer_equipment_1_short:0 "Makai Modern Tank Destroyer"
 makai_modern_tank_destroyer_equipment_1_desc:0 "Modern Tank Destroyers are an evolution of earlier light and medium TDs, preferring mobility and stealth over heavy armor."
 makai_modern_tank_artillery_equipment_1:0 "Makai Modern SP Artillery"
 makai_modern_tank_artillery_equipment_1_short:0 "Makai Modern SP Artillery"
 makai_modern_tank_artillery_equipment_1_desc:0 "Modern self-propelled artillery vehicles may superficially resemble tanks, but they are generally lightly armored, too lightly to survive in direct-fire combat. However, they protect their crews against shrapnel and small arms."
 makai_modern_tank_aa_equipment_1:0 "Makai Modern SP Anti-Air"
 makai_modern_tank_aa_equipment_1_short:0 "Makai Modern SP Anti-Air"
 makai_modern_tank_aa_equipment_1_desc:0 "With a combination of missiles and rapid fire cannon, modern anti-aircraft artillery presents a deadly threat to hostile aviation assets."
 makai_fighter_equipment_3:0 "Makai Fighter III"
 makai_fighter_equipment_3_short:0 "Makai Fighter III"
 makai_fighter_equipment_3_desc:0 "While our previous generations of fighter plane have proven worthy, any advantage gained by a better design should be taken. This aircraft will be the pinnacle platform of piston-engined fighter that will have excellent power, high agility, deadly weaponry and good range."
 makai_cv_fighter_equipment_3:0 "Makai Carrier Fighter III"
 makai_cv_fighter_equipment_3_short:0 "Makai Carrier Fighter III"
 makai_cv_fighter_equipment_3_desc:0 "An advanced fighter modified to launch from and land on aircraft carriers."
 makai_cas_equipment_3:0 "Makai Close Air Support III"
 makai_cas_equipment_3_short:0 "Makai Close Air Support III"
 makai_cas_equipment_3_desc:0 "The ever increasing capability of target AA and enemy interceptors require further evolution of our CAS aircraft. The new design incorporates increased engine power, airframe improvements for increased diving capability and protection, as well as even greater payloads."
 makai_cv_cas_equipment_3:0 "Makai Carrier Close Air Support III"
 makai_cv_cas_equipment_3_short:0 "Makai Carrier Close Air Support III"
 makai_cv_cas_equipment_3_desc:0 "An advanced close air support plane modified to launch from and land on aircraft carriers."
 makai_nav_bomber_equipment_3:0 "Makai Naval Bomber III"
 makai_nav_bomber_equipment_3_short:0 "Makai Naval Bomber III"
 makai_nav_bomber_equipment_3_desc:0 "All-metal designs and powerful airbrakes allow for more complex naval aeronautics. The planes of the future will demand a larger crew to operate these advanced systems, however."
 makai_cv_nav_bomber_equipment_3:0 "Makai Carrier Naval Bomber III"
 makai_cv_nav_bomber_equipment_3_short:0 "Makai Carrier Naval Bomber III"
 makai_cv_nav_bomber_equipment_3_desc:0 "An advanced naval bomber modified to launch from and land on aircraft carriers."
 makai_heavy_fighter_equipment_3:0 "Makai Heavy Fighter III"
 makai_heavy_fighter_equipment_3_short:0 "Makai Heavy Fighter III"
 makai_heavy_fighter_equipment_3_desc:0 "Though our heavy fighter force has shown adeptness in various roles, we must consider a new design that will enhance its ability relative to enemy fighters, as well as allow it to continue intercepting increasingly faster and better defended enemy bombers."
 makai_tac_bomber_equipment_3:0 "Makai Tactical Bomber III"
 makai_tac_bomber_equipment_3_short:0 "Makai Tactical Bomber III"
 makai_tac_bomber_equipment_3_desc:0 "Taking a page from the advancements in fighter planes, unconventional materials and shapes can make new designs some of the fastest and best performing twin-engine planes ever built."
 makai_strat_bomber_equipment_3:0 "Makai Strategic Bomber III"
 makai_strat_bomber_equipment_3_short:0 "Makai Strategic Bomber III"
 makai_strat_bomber_equipment_3_desc:0 "To avoid losses to enemy fighters and ground fire, our next design will fly at great altitude. It will be larger to carry both an enormous payload and more fuel, to increase range."
 makai_infantry_equipment_3:0 "Makai Infantry Equipment III"
 makai_infantry_equipment_3_short:0 "Makai Infantry Equipment III"
 makai_infantry_equipment_3_desc:0 "Personal and crew served weapons for infantry as well as the various other bits of kit a soldier needs. Further modernized to include personal Assault Rifles and anti-tank rockets."
 makai_artillery_equipment_3:0 "Makai Advanced Artillery"
 makai_artillery_equipment_3_short:0 "Makai Advanced Artillery"
 makai_artillery_equipment_3_desc:0 "Light-weight artillery capable of being broken down for transport, making it possible to bring artillery support to areas previously difficult to reach."
 makai_jet_fighter_equipment_2:0 "Makai Jet Fighter II"
 makai_jet_fighter_equipment_2_short:0 "Makai Jet Fighter II"
 makai_jet_fighter_equipment_2_desc:0 "New swept wing designs and lighter material choices will allow us to extend the range and speed of the revolutionary jet fighters even further."
 makai_jet_tac_bomber_equipment_2:0 "Makai Jet Tactical Bomber II"
 makai_jet_tac_bomber_equipment_2_short:0 "Makai Jet Tactical Bomber II"
 makai_jet_tac_bomber_equipment_2_desc:0 "Not content with speed, future jet bombers will set altitude and range records, delivering payloads and performing reconnaissance on intercontinental missions."
 makai_jet_strat_bomber_equipment_1:0 "Makai Jet Strategic Bomber I"
 makai_jet_strat_bomber_equipment_1_short:0 "Makai Jet Strategic Bomber I"
 makai_jet_strat_bomber_equipment_1_desc:0 "Multiple jet engines allow new designs unprecedented speed while maintaining a large payload and long range. These planes are built for a new era of weapons of mass destruction."
 makai_anti_air_equipment_3:0 "Makai Advanced Anti-Air"
 makai_anti_air_equipment_3_short:0 "Makai Advanced Anti-Air"
 makai_anti_air_equipment_3_desc:0 "An advanced mobile flak gun with greater reach and firing capacity, to combat even the fastest and highest-flying enemy aircraft."
 makai_anti_tank_equipment_3:0 "Makai Advanced Anti-Tank"
 makai_anti_tank_equipment_3_short:0 "Makai Advanced Anti-Tank"
 makai_anti_tank_equipment_3_desc:0 "Combining different kinds of new ammunition technology with guns with higher muzzle velocities, these anti-tank guns are prepared for whatever new armor our enemies may develop."
