l_russian:
 makai_infantry_equipment_1:0 "Макай: Пехотное снаряжение I"
 makai_infantry_equipment_1_short:0 "Макай: Пехотное снаряжение I"
 makai_infantry_equipment_1_desc:0 "Индивидуальное и коллективное стрелковое оружие, а также прочие элементы экипировки пехотинца."
 makai_artillery_equipment_1:0 "Макай: Буксируемая артиллерия"
 makai_artillery_equipment_1_short:0 "Макай: Буксируемая артиллерия"
 makai_artillery_equipment_1_desc:0 "Крупнокалиберные орудия — пушки и гаубицы, — способные доставлять снаряды на расстояние, значительно превышающее дальность стрелкового оружия."
 makai_anti_air_equipment_1:0 "Макай: Буксируемое орудие ПВО"
 makai_anti_air_equipment_1_short:0 "Макай: Буксируемое орудие ПВО"
 makai_anti_air_equipment_1_desc:0 "Зенитные орудия предназначены для борьбы с авиацией противника, хотя скорострельные пушки неплохо справляются и с наземными целями."
 makai_anti_tank_equipment_1:0 "Макай: Буксируемое орудие ПТО"
 makai_anti_tank_equipment_1_short:0 "Макай: Буксируемое орудие ПТО"
 makai_anti_tank_equipment_1_desc:0 "Артиллерийское орудие, стреляющее прямой наводкой бронебойными боеприпасами для поражения танков и других защищенных целей."
 makai_support_equipment_1:0 "Макай: Дополнительное оснащение"
 makai_support_equipment_1_short:0 "Макай: Дополнительное оснащение"
 makai_support_equipment_1_desc:0 "Радиостанции, машины, понтоны и прочее дополнительное армейское снаряжение."
 makai_motorized_equipment_1:0 "Макай: Грузовики"
 makai_motorized_equipment_1_short:0 "Макай: Грузовики"
 makai_motorized_equipment_1_desc:0 "Автотранспорт — первый шаг на пути к механизации армии. Гражданские грузовики легко адаптируются к военным нуждам: перевозят солдат, тянут пушки и доставляют снабжение. Это заметно повышает стратегическую мобильность пехотных частей, которым в противном случае пришлось бы двигаться маршем."
 makai_fighter_equipment_1:0 "Макай: Истребитель I"
 makai_fighter_equipment_1_short:0 "Макай: Истребитель I"
 makai_fighter_equipment_1_desc:0 "Использование радиальных двигателей и цельнометаллических фюзеляжей позволило появиться на свет легким монопланам. Это наш первый шаг на пути к современному истребителю."
 makai_cv_fighter_equipment_1:0 "Макай: Палубный истребитель I"
 makai_cv_fighter_equipment_1_short:0 "Макай: Палубный истребитель I"
 makai_cv_fighter_equipment_1_desc:0 "Ранний истребитель, модифицированный для взлета с и посадки на авианосец."
 makai_cas_equipment_1:0 "Макай: Штурмовик I"
 makai_cas_equipment_1_short:0 "Макай: Штурмовик I"
 makai_cas_equipment_1_desc:0 "Военная доктрина требует наличия самолета, способного поддерживать огнем боевые действия на земле. Такая машина несет меньше вооружения, чем тактический бомбардировщик, но способна при этом атаковать небольшие цели при помощи пушек и бомбардировок в пикировании."
 makai_cv_cas_equipment_1:0 "Макай: Палубный штурмовик I"
 makai_cv_cas_equipment_1_short:0 "Макай: Палубный штурмовик I"
 makai_cv_cas_equipment_1_desc:0 "Ранний штурмовик, модифицированный для взлета с и посадки на авианосец."
 makai_nav_bomber_equipment_1:0 "Макай: Морской бомбардировщик I"
 makai_nav_bomber_equipment_1_short:0 "Макай: Морской бомбардировщик I"
 makai_nav_bomber_equipment_1_desc:0 "Морская авиация будет крайне востребована в связи с изменениями в характере войны на море — в частности, усилением роли подводных лодок. Потребуются гидросамолеты, способные выполнять роль разведчиков и пикирующих бомбардировщиков."
 makai_cv_nav_bomber_equipment_1:0 "Макай: Палубный бомбардировщик I"
 makai_cv_nav_bomber_equipment_1_short:0 "Макай: Палубный бомбардировщик I"
 makai_cv_nav_bomber_equipment_1_desc:0 "Ранний морской бомбардировщик, модифицированный для взлета с и посадки на авианосец."
 makai_heavy_fighter_equipment_1:0 "Макай: Тяжелый истребитель I"
 makai_heavy_fighter_equipment_1_short:0 "Макай: Тяжелый истребитель I"
 makai_heavy_fighter_equipment_1_desc:0 "Эскадрильям бомбардировщиков требуется защита от перехватчиков врага Для этого нам нужен истребитель, не уступающий бомбардировщикам по дальности полета. Эти машины крупнее, тяжелее и уступают по маневренности обычным истребителям, но зато превосходят их вооружением."
 makai_tac_bomber_equipment_1:0 "Макай: Тактический бомбардировщик I"
 makai_tac_bomber_equipment_1_short:0 "Макай: Тактический бомбардировщик I"
 makai_tac_bomber_equipment_1_desc:0 "Средним бомбардировщикам нужна скорость и способность выполнять различные задачи. Схема с двумя двигателями, позволяющая сохранить относительную легкость, прослужит нам еще многие годы."
 makai_strat_bomber_equipment_1:0 "Макай: Стратегический бомбардировщик I"
 makai_strat_bomber_equipment_1_short:0 "Макай: Стратегический бомбардировщик I"
 makai_strat_bomber_equipment_1_desc:0 "За время Первой мировой войны и после нее стало ясно, что бомбардировки военных целей и крупных городов — ключ к победе в следующей войне. Как минимум, нам необходимы самолеты, способные наносить подобные удары. Бомбардировщику требуется высокий потолок, хорошая скорость и большая бомбовая нагрузка. Это будет внушительная конструкция с несколькими двигателями, а также оборонительным вооружением."
 makai_destroyer_4:0 "Макай: Эсминец IV"
 makai_destroyer_4_short:0 "Макай: Эсминец IV"
 makai_destroyer_4_desc:0 "Современный эсминец характеризуется наличием различных технологий обнаружения, новой системой сброса глубинных бомб, а также увеличенными по сравнению с предшественниками размерами."
 makai_light_cruiser_4:0 "Макай: Легкий крейсер IV"
 makai_light_cruiser_4_short:0 "Макай: Легкий крейсер IV"
 makai_light_cruiser_4_desc:0 "Ограничения ушли в прошлое, и новейшее поколение легких крейсеров получило более мощное вооружение, а также эффективные системы ПВО."
 makai_heavy_cruiser_4:0 "Макай: Тяжелый крейсер IV"
 makai_heavy_cruiser_4_short:0 "Макай: Тяжелый крейсер IV"
 makai_heavy_cruiser_4_desc:0 "Вершиной развития тяжелых крейсеров становятся современные образцы увеличенного размера с улучшенной бронезащитой, а также скорострельными орудиями."
 makai_battleship_4:0 "Макай: Линкор IV"
 makai_battleship_4_short:0 "Макай: Линкор IV"
 makai_battleship_4_desc:0 "Новые линкоры, которые могут стать последним поколением уходящей эпохи, разработаны с упором на мощь орудий и эффективность ПВО."
 makai_carrier_4:0 "Макай: Авианосец IV"
 makai_carrier_4_short:0 "Макай: Авианосец IV"
 makai_carrier_4_desc:0 "По мере того как соглашения теряют свою силу, мы получаем возможность разрабатывать более современные и вместительные авианосцы, чтобы завоевать превосходство в воздухе."
 makai_submarine_4:0 "Макай: Подводная лодка IV"
 makai_submarine_4_short:0 "Макай: Подводная лодка IV"
 makai_submarine_4_desc:0 "Современные субмарины используют новейшие разработки в области двигателей и вооружения, обладают оптимальными обводами и способны погружаться на большую глубину."
 makai_super_heavy_tank_equipment_1:0 "Макай: Сверхтяжелый танк"
 makai_super_heavy_tank_equipment_1_short:0 "Макай: Сверхтяжелый танк"
 makai_super_heavy_tank_equipment_1_desc:0 "Сверхтяжелые танки — эволюция концепции тяжелого танка. Они крупнее, тяжелее, с более мощным вооружением, но при этом медленнее, испытывают проблемы на мягком грунте и способы пересекать лишь наиболее прочные мосты."
 makai_super_heavy_tank_destroyer_equipment_1:0 "Макай: Сверхтяжелая ПТ-установка"
 makai_super_heavy_tank_destroyer_equipment_1_short:0 "Макай: Сверхтяжелая ПТ-установка"
 makai_super_heavy_tank_destroyer_equipment_1_desc:0 "Шасси сверхтяжелого танка с крупнокалиберным орудием, закрепленным в корпусе вместо башни."
 makai_super_heavy_tank_artillery_equipment_1:0 "Макай: Сверхтяжелая САУ"
 makai_super_heavy_tank_artillery_equipment_1_short:0 "Макай: Сверхтяжелая САУ"
 makai_super_heavy_tank_artillery_equipment_1_desc:0 "Огромное артиллерийское орудие на сверхтяжелом шасси."
 makai_super_heavy_tank_aa_equipment_1:0 "Макай: Сверхтяжелая ЗСУ"
 makai_super_heavy_tank_aa_equipment_1_short:0 "Макай: Сверхтяжелая ЗСУ"
 makai_super_heavy_tank_aa_equipment_1_desc:0 "Сверхтяжелое шасси с зенитным вооружением."
 makai_fighter_equipment_2:0 "Макай: Истребитель II"
 makai_fighter_equipment_2_short:0 "Макай: Истребитель II"
 makai_fighter_equipment_2_desc:0 "По мере того как мы применяем новые технологии к уже отработанным схемам, развитие истребителей идет невиданными темпами. Нам нужен истребитель, отличающийся высокой скоростью, маневренностью на больших высотах и максимальной дальностью полета. Кроме того, он должен нести мощное вооружение."
 makai_cv_fighter_equipment_2:0 "Макай: Палубный истребитель II"
 makai_cv_fighter_equipment_2_short:0 "Макай: Палубный истребитель II"
 makai_cv_fighter_equipment_2_desc:0 "Улучшенный истребитель, модифицированный для взлета с и посадки на авианосец."
 makai_cas_equipment_2:0 "Макай: Штурмовик II"
 makai_cas_equipment_2_short:0 "Макай: Штурмовик II"
 makai_cas_equipment_2_desc:0 "Боевые действия показали, что для выживания под огнем истребителей и ПВО штурмовику требуются высокие скорость, маневренность и бронезащита. Следующее поколение штурмовиков также использует более мощные бомбы, пушки и пулеметы."
 makai_cv_cas_equipment_2:0 "Макай: Палубный штурмовик II"
 makai_cv_cas_equipment_2_short:0 "Макай: Палубный штурмовик II"
 makai_cv_cas_equipment_2_desc:0 "Улучшенный штурмовик, модифицированный для взлета с и посадки на авианосец."
 makai_nav_bomber_equipment_2:0 "Макай: Морской бомбардировщик II"
 makai_nav_bomber_equipment_2_short:0 "Макай: Морской бомбардировщик II"
 makai_nav_bomber_equipment_2_desc:0 "Улучшенная аэродинамика и новые двигатели заметно повышают скорость и боевую эффективность морской авиации."
 makai_cv_nav_bomber_equipment_2:0 "Макай: Палубный бомбардировщик II"
 makai_cv_nav_bomber_equipment_2_short:0 "Макай: Палубный бомбардировщик II"
 makai_cv_nav_bomber_equipment_2_desc:0 "Улучшенный морской бомбардировщик, модифицированный для взлета с и посадки на авианосец."
 makai_heavy_fighter_equipment_2:0 "Макай: Тяжелый истребитель II"
 makai_heavy_fighter_equipment_2_short:0 "Макай: Тяжелый истребитель II"
 makai_heavy_fighter_equipment_2_desc:0 "Война показала, что тяжелые истребители — легкая добыча для более маневренных перехватчиков, однако благодаря вооружению они хорошо проявляют себя в схватке с бомбардировщиками. Следующий вариант будет отличаться повышенной огневой мощью против воздушных и даже наземных целей, а также улучшенными скоростью и дальностью полета."
 makai_tac_bomber_equipment_2:0 "Макай: Тактический бомбардировщик II"
 makai_tac_bomber_equipment_2_short:0 "Макай: Тактический бомбардировщик II"
 makai_tac_bomber_equipment_2_desc:0 "Более тяжелые тактические бомбардировщики отличаются увеличенными дальностью полета, скоростью и бомбовой нагрузкой и при этом не теряют способность выполнять самые разнообразные задачи."
 makai_strat_bomber_equipment_2:0 "Макай: Стратегический бомбардировщик II"
 makai_strat_bomber_equipment_2_short:0 "Макай: Стратегический бомбардировщик II"
 makai_strat_bomber_equipment_2_desc:0 "Бомбардировки успешно подрывают способность врага вести боевые действия. Улучшенное оборонительное вооружение и повышенная скорость позволят новым самолетам возвращаться невредимыми, а увеличенные бомбовая нагрузка и дальность полета повысят эффективность ударов."
 makai_infantry_equipment_2:0 "Макай: Пехотное снаряжение II"
 makai_infantry_equipment_2_short:0 "Макай: Пехотное снаряжение II"
 makai_infantry_equipment_2_desc:0 "Индивидуальное и коллективное стрелковое оружие, а также прочие элементы экипировки пехотинца. Включает большое количество пистолетов-пулеметов и противотанковых ружей."
 makai_artillery_equipment_2:0 "Макай: Улучшенная артиллерия"
 makai_artillery_equipment_2_short:0 "Макай: Улучшенная артиллерия"
 makai_artillery_equipment_2_desc:0 "Новая конструкция гаубицы, использующая гидравлическое гашение отдачи и более длинный ствол."
 makai_anti_air_equipment_2:0 "Макай: Улучшенное ПВО"
 makai_anti_air_equipment_2_short:0 "Макай: Улучшенное ПВО"
 makai_anti_air_equipment_2_desc:0 "Зенитные орудия с длинными стволами и мощными снарядами, способные попадать в цели на большой высоте."
 makai_anti_tank_equipment_2:0 "Макай: Улучшенное ПТО"
 makai_anti_tank_equipment_2_short:0 "Макай: Улучшенное ПТО"
 makai_anti_tank_equipment_2_desc:0 "Крупнокалиберные орудия, способные пробивать толстую и наклонную броню тяжелых танков."
 makai_mechanized_equipment_2:0 "Макай: Бронетранспортёры II"
 makai_mechanized_equipment_2_short:0 "Макай: Бронетранспортёры II"
 makai_mechanized_equipment_2_desc:0 "Механизированная пехота оснащена бронетранспортерами или боевыми машинами. От моторизированной она отличается тем, что ее техника обеспечивает определенную защиту от вражеского огня, в то время как моторизированные подразделения обычно снабжаются небронированными машинами — джипами и грузовиками."
 makai_modern_tank_equipment_1:0 "Макай: Основной танк"
 makai_modern_tank_equipment_1_short:0 "Макай: Основной танк"
 makai_modern_tank_equipment_1_desc:0 "Современные танки — это маневренные, многоцелевые боевые машины, сочетающие в себе огневую мощь тяжелого танка с мобильностью среднего танка. Они предвосхитили появление современных основных боевых танков."
 makai_modern_tank_destroyer_equipment_1:0 "Макай: Современная ПТ-установка"
 makai_modern_tank_destroyer_equipment_1_short:0 "Макай: Современная ПТ-установка"
 makai_modern_tank_destroyer_equipment_1_desc:0 "Современные противотанковые САУ выросли из легких и средних ПТ-САУ. Во главу угла в проекте поставлена мобильность и низкий силуэт."
 makai_modern_tank_artillery_equipment_1:0 "Макай: Современная САУ"
 makai_modern_tank_artillery_equipment_1_short:0 "Макай: Современная САУ"
 makai_modern_tank_artillery_equipment_1_desc:0 "Современные самоходные артиллерийские установки могут напоминать танки с виду, но обладают минимальным бронированием и не способны участвовать в бою. Экипажи при этом защищены от осколков и стрелкового оружия."
 makai_modern_tank_aa_equipment_1:0 "Макай: Современная ЗСУ"
 makai_modern_tank_aa_equipment_1_short:0 "Макай: Современная ЗСУ"
 makai_modern_tank_aa_equipment_1_desc:0 "Современное зенитное вооружение, будь то ракеты или скорострельные пушки, представляет смертельную опасность для вражеской авиации."
 makai_fighter_equipment_3:0 "Макай: Истребитель III"
 makai_fighter_equipment_3_short:0 "Макай: Истребитель III"
 makai_fighter_equipment_3_desc:0 "Предыдущие разработки достойно себя проявили, но это не повод отказываться от дополнительных преимуществ. Новый самолет, обладающий непревзойденной мощностью, смертоносным вооружением и высокой дальностью полета, станет вершиной развития поршневой авиации."
 makai_cv_fighter_equipment_3:0 "Макай: Палубный истребитель III"
 makai_cv_fighter_equipment_3_short:0 "Макай: Палубный истребитель III"
 makai_cv_fighter_equipment_3_desc:0 "Современный истребитель, модифицированный для взлета с и посадки на авианосец."
 makai_cas_equipment_3:0 "Макай: Штурмовик III"
 makai_cas_equipment_3_short:0 "Макай: Штурмовик III"
 makai_cas_equipment_3_desc:0 "Рост эффективности орудий ПВО и перехватчиков требуют от нас улучшения штурмовиков. Новый образец обладает лучшей защитой, более мощным двигателем и улучшенной конструкцией, а также увеличенной бомбовой нагрузкой."
 makai_cv_cas_equipment_3:0 "Макай: Палубный штурмовик III"
 makai_cv_cas_equipment_3_short:0 "Макай: Палубный штурмовик III"
 makai_cv_cas_equipment_3_desc:0 "Современный штурмовик, модифицированный для взлета с и посадки на авианосец."
 makai_nav_bomber_equipment_3:0 "Макай: Морской бомбардировщик III"
 makai_nav_bomber_equipment_3_short:0 "Макай: Морской бомбардировщик III"
 makai_nav_bomber_equipment_3_desc:0 "Цельнометаллические корпуса и аэродинамические тормоза заметно сказываются на летных свойствах. Платить за это приходится увеличенной численностью экипажа."
 makai_cv_nav_bomber_equipment_3:0 "Макай: Палубный бомбардировщик III"
 makai_cv_nav_bomber_equipment_3_short:0 "Макай: Палубный бомбардировщик III"
 makai_cv_nav_bomber_equipment_3_desc:0 "Современный морской бомбардировщик, модифицированный для взлета с и посадки на авианосец."
 makai_heavy_fighter_equipment_3:0 "Макай: Тяжелый истребитель III"
 makai_heavy_fighter_equipment_3_short:0 "Макай: Тяжелый истребитель III"
 makai_heavy_fighter_equipment_3_desc:0 "Хотя эскадрильи тяжелых истребителей неплохо действуют в различных ролях, нам следует разработать новые улучшения, которые повысят их шансы в схватках с истребителями, а также позволят перехватывать более быстрые и защищенные бомбардировщики противника."
 makai_tac_bomber_equipment_3:0 "Макай: Тактический бомбардировщик III"
 makai_tac_bomber_equipment_3_short:0 "Макай: Тактический бомбардировщик III"
 makai_tac_bomber_equipment_3_desc:0 "Взяв лучшие решения от современных истребителей и новейшие материалы, мы сможем создать двухмоторный бомбардировщик, который превзойдет по скорости и эффективности все предыдущие образцы."
 makai_strat_bomber_equipment_3:0 "Макай: Стратегический бомбардировщик III"
 makai_strat_bomber_equipment_3_short:0 "Макай: Стратегический бомбардировщик III"
 makai_strat_bomber_equipment_3_desc:0 "Чтобы снизить потери от огня орудий ПВО и перехватчиков, нужно повысить максимальную высоту полета. Новая модель будет еще крупнее и сможет нести увеличенную бомбовую нагрузку и большой запас топлива, чтобы повысить дальность полета."
 makai_infantry_equipment_3:0 "Макай: Пехотное снаряжение III"
 makai_infantry_equipment_3_short:0 "Макай: Пехотное снаряжение III"
 makai_infantry_equipment_3_desc:0 "Индивидуальное и коллективное стрелковое оружие, а также прочие элементы экипировки пехотинца. Включает штурмовые винтовки и противотанковые гранатометы."
 makai_artillery_equipment_3:0 "Макай: Усовершенствованная артиллерия"
 makai_artillery_equipment_3_short:0 "Макай: Усовершенствованная артиллерия"
 makai_artillery_equipment_3_desc:0 "Облегченная конструкция, предусматривающая разборку для транспортировки, что позволяет обеспечить огневой поддержкой труднодоступные места."
 makai_jet_fighter_equipment_2:0 "Макай: Реактивный истребитель II"
 makai_jet_fighter_equipment_2_short:0 "Макай: Реактивный истребитель II"
 makai_jet_fighter_equipment_2_desc:0 "Стреловидное крыло и легкие материалы позволили нам еще больше увеличить скорость, а заодно и дальность действия истребителей."
 makai_jet_tac_bomber_equipment_2:0 "Макай: Реактивный тактический бомбардировщик II"
 makai_jet_tac_bomber_equipment_2_short:0 "Макай: Реактивный тактический бомбардировщик II"
 makai_jet_tac_bomber_equipment_2_desc:0 "Сверхсовременные реактивные бомбардировщики — рекордсмены по высоте и дальности, они способны проводить разведку и наносить удары на другом континенте."
 makai_jet_strat_bomber_equipment_1:0 "Макай: Реактивный стратегический бомбардировщик I"
 makai_jet_strat_bomber_equipment_1_short:0 "Макай: Реактивный стратегический бомбардировщик I"
 makai_jet_strat_bomber_equipment_1_desc:0 "Реактивные двигатели наделят новые образцы непревзойденной скоростью без ущерба для бомбовой нагрузки и дальности полета. Эти самолеты открывают новую эру оружия массового поражения."
 makai_anti_air_equipment_3:0 "Макай: Усовершенствованное ПВО"
 makai_anti_air_equipment_3_short:0 "Макай: Усовершенствованное ПВО"
 makai_anti_air_equipment_3_desc:0 "Более мощная самоходная зенитка с повышенной дальностью, представляющая угрозу даже для самых быстрых и самых высотных самолетов."
 makai_anti_tank_equipment_3:0 "Макай: Усовершенствованное ПТО"
 makai_anti_tank_equipment_3_short:0 "Макай: Усовершенствованное ПТО"
 makai_anti_tank_equipment_3_desc:0 "Повышение скорости снаряда вместе с разработками новых типов боеприпасов позволяют справиться с любой броней, которая может встретиться в бою."
