 touhou_tank_optional_demonforce_maintenance_desc:0 "活体结构封合细小裂口，以可靠性表示维护收益；再生组织增加能耗与负重。\n\n研发条件：（§Y$gwtank_chassis$§! 或 §Y$basic_light_tank_chassis$§! 或 §Y$improved_light_tank_chassis$§! 或 §Y$advanced_light_tank_chassis$§! 或 §Y$basic_medium_tank_chassis$§! 或 §Y$improved_medium_tank_chassis$§! 或 §Y$advanced_medium_tank_chassis$§! 或 §Y$main_battle_tank_chassis$§! 或 §Y$basic_heavy_tank_chassis$§! 或 §Y$improved_heavy_tank_chassis$§! 或 §Y$advanced_heavy_tank_chassis$§! 或 §Y$super_heavy_tank_chassis$§!）、§Y$gwtank_chassis$§!、§Y$tech_maintenance_company2$§!。须采用对应制造体系；配件用于幻想乡专用底盘。"
 touhou_tank_optional_demonforce_secondary_mg:0 "寄生飞羽巢"
