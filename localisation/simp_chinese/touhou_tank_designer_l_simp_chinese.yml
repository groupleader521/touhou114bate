 touhou_tank_optional_wakan_maintenance_desc:0 "断裂符阵由备用御札续接，改善稳定性并略减维持能耗，占用额外空间。\n\n研发条件：（§Y$gwtank_chassis$§! 或 §Y$basic_light_tank_chassis$§! 或 §Y$improved_light_tank_chassis$§! 或 §Y$advanced_light_tank_chassis$§! 或 §Y$basic_medium_tank_chassis$§! 或 §Y$improved_medium_tank_chassis$§! 或 §Y$advanced_medium_tank_chassis$§! 或 §Y$main_battle_tank_chassis$§! 或 §Y$basic_heavy_tank_chassis$§! 或 §Y$improved_heavy_tank_chassis$§! 或 §Y$advanced_heavy_tank_chassis$§! 或 §Y$super_heavy_tank_chassis$§!）、§Y$gwtank_chassis$§!、§Y$tech_maintenance_company2$§!。须采用对应制造体系；配件用于幻想乡专用底盘。"
 touhou_tank_optional_wakan_secondary_mg:0 "自动迎击御札环"
 touhou_tank_optional_wakan_secondary_mg_short:0 "自动迎击御札环"
 touhou_tank_optional_wakan_secondary_mg_desc:0 "御札在车体周围迎击近距离目标，火力较低但改善防御。\n\n研发条件：（§Y$gwtank_chassis$§! 或 §Y$basic_light_tank_chassis$§! 或 §Y$improved_light_tank_chassis$§! 或 §Y$advanced_light_tank_chassis$§! 或 §Y$basic_medium_tank_chassis$§! 或 §Y$improved_medium_tank_chassis$§! 或 §Y$advanced_medium_tank_chassis$§! 或 §Y$main_battle_tank_chassis$§! 或 §Y$basic_heavy_tank_chassis$§! 或 §Y$improved_heavy_tank_chassis$§! 或 §Y$advanced_heavy_tank_chassis$§! 或 §Y$super_heavy_tank_chassis$§!）、§Y$gwtank_chassis$§!、§Y$infantry_weapons$§!。须采用对应制造体系；配件用于幻想乡专用底盘。"
 touhou_tank_optional_wakan_secondary_cannon:0 "贯界御札副炮"
 touhou_tank_optional_wakan_secondary_cannon_short:0 "贯界御札副炮"
 touhou_tank_optional_wakan_secondary_cannon_desc:0 "集中符力贯穿局部防护，侧重穿甲和硬攻，射击间隙拉低突破。\n\n研发条件：（§Y$gwtank_chassis$§! 或 §Y$basic_light_tank_chassis$§! 或 §Y$improved_light_tank_chassis$§! 或 §Y$advanced_light_tank_chassis$§! 或 §Y$basic_medium_tank_chassis$§! 或 §Y$improved_medium_tank_chassis$§! 或 §Y$advanced_medium_tank_chassis$§! 或 §Y$main_battle_tank_chassis$§! 或 §Y$basic_heavy_tank_chassis$§! 或 §Y$improved_heavy_tank_chassis$§! 或 §Y$advanced_heavy_tank_chassis$§! 或 §Y$super_heavy_tank_chassis$§!）、§Y$gwtank_chassis$§!、§Y$gw_artillery$§!。须采用对应制造体系；配件用于幻想乡专用底盘。"
 touhou_tank_optional_wakan_secondary_howitzer:0 "连锁镇地雷符"
 touhou_tank_optional_wakan_secondary_howitzer_short:0 "连锁镇地雷符"
 touhou_tank_optional_wakan_secondary_howitzer_desc:0 "雷符按次序震击地面，兼顾软攻与防御；布阵拖累突击速度。\n\n研发条件：（§Y$gwtank_chassis$§! 或 §Y$basic_light_tank_chassis$§! 或 §Y$improved_light_tank_chassis$§! 或 §Y$advanced_light_tank_chassis$§! 或 §Y$basic_medium_tank_chassis$§! 或 §Y$improved_medium_tank_chassis$§! 或 §Y$advanced_medium_tank_chassis$§! 或 §Y$main_battle_tank_chassis$§! 或 §Y$basic_heavy_tank_chassis$§! 或 §Y$improved_heavy_tank_chassis$§! 或 §Y$advanced_heavy_tank_chassis$§! 或 §Y$super_heavy_tank_chassis$§!）、§Y$gwtank_chassis$§!、§Y$interwar_artillery$§!。须采用对应制造体系；配件用于幻想乡专用底盘。"
 touhou_tank_optional_wakan_secondary_lance:0 "破邪贯通钉"
