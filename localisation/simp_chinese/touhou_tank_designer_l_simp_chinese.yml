 touhou_tank_magic_light_2_armor_desc:0 "人偶炼金外壳、妖兽角质外甲或鬼铸护甲；与底盘共同承担所有角色的公共防护。\n\n研发条件：§Y$improved_light_tank_chassis$§!、§Y$gwtank_chassis$§!。须采用对应制造体系；配件用于幻想乡专用底盘。"
