 touhou_tank_optional_magic_emergency_battery_desc:0 "第二魔力核增幅速度与火力，但可靠性、能耗和造价代价很高。\n\n研发条件：（§Y$gwtank_chassis$§! 或 §Y$basic_light_tank_chassis$§! 或 §Y$improved_light_tank_chassis$§! 或 §Y$advanced_light_tank_chassis$§! 或 §Y$basic_medium_tank_chassis$§! 或 §Y$improved_medium_tank_chassis$§! 或 §Y$advanced_medium_tank_chassis$§! 或 §Y$main_battle_tank_chassis$§! 或 §Y$basic_heavy_tank_chassis$§! 或 §Y$improved_heavy_tank_chassis$§! 或 §Y$advanced_heavy_tank_chassis$§! 或 §Y$super_heavy_tank_chassis$§!）、§Y$gwtank_chassis$§!、§Y$engine_tech_1$§!。须采用对应制造体系；配件用于幻想乡专用底盘。"
 touhou_tank_optional_magic_cooling_fins:0 "魔力泄流梳"
