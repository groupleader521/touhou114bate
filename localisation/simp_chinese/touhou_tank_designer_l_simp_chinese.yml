 touhou_tank_optional_demonforce_secondary_cannon_desc:0 "妖角以冲击方式破坏近敌，硬攻较高，但额外活体关节降低可靠性。\n\n研发条件：（§Y$gwtank_chassis$§! 或 §Y$basic_light_tank_chassis$§! 或 §Y$improved_light_tank_chassis$§! 或 §Y$advanced_light_tank_chassis$§! 或 §Y$basic_medium_tank_chassis$§! 或 §Y$improved_medium_tank_chassis$§! 或 §Y$advanced_medium_tank_chassis$§! 或 §Y$main_battle_tank_chassis$§! 或 §Y$basic_heavy_tank_chassis$§! 或 §Y$improved_heavy_tank_chassis$§! 或 §Y$advanced_heavy_tank_chassis$§! 或 §Y$super_heavy_tank_chassis$§!）、§Y$gwtank_chassis$§!、§Y$gw_artillery$§!。须采用对应制造体系；配件用于幻想乡专用底盘。"
 touhou_tank_optional_demonforce_secondary_howitzer:0 "孵化爆裂妖卵"
 touhou_tank_optional_demonforce_secondary_howitzer_short:0 "孵化爆裂妖卵"
 touhou_tank_optional_demonforce_secondary_howitzer_desc:0 "抛出不稳定妖卵制造范围爆裂，软攻和少量硬攻增加，事故率高。\n\n研发条件：（§Y$gwtank_chassis$§! 或 §Y$basic_light_tank_chassis$§! 或 §Y$improved_light_tank_chassis$§! 或 §Y$advanced_light_tank_chassis$§! 或 §Y$basic_medium_tank_chassis$§! 或 §Y$improved_medium_tank_chassis$§! 或 §Y$advanced_medium_tank_chassis$§! 或 §Y$main_battle_tank_chassis$§! 或 §Y$basic_heavy_tank_chassis$§! 或 §Y$improved_heavy_tank_chassis$§! 或 §Y$advanced_heavy_tank_chassis$§! 或 §Y$super_heavy_tank_chassis$§!）、§Y$gwtank_chassis$§!、§Y$interwar_artillery$§!。须采用对应制造体系；配件用于幻想乡专用底盘。"
 touhou_tank_optional_demonforce_secondary_lance:0 "缠咬贯甲触腕"
 touhou_tank_optional_demonforce_secondary_lance_short:0 "缠咬贯甲触腕"
 touhou_tank_optional_demonforce_secondary_lance_desc:0 "触腕抓附目标后穿刺装甲，硬攻较强；拖曳机构降低速度和可靠性。\n\n研发条件：（§Y$gwtank_chassis$§! 或 §Y$basic_light_tank_chassis$§! 或 §Y$improved_light_tank_chassis$§! 或 §Y$advanced_light_tank_chassis$§! 或 §Y$basic_medium_tank_chassis$§! 或 §Y$improved_medium_tank_chassis$§! 或 §Y$advanced_medium_tank_chassis$§! 或 §Y$main_battle_tank_chassis$§! 或 §Y$basic_heavy_tank_chassis$§! 或 §Y$improved_heavy_tank_chassis$§! 或 §Y$advanced_heavy_tank_chassis$§! 或 §Y$super_heavy_tank_chassis$§!）、§Y$gwtank_chassis$§!、§Y$interwar_antitank$§!。须采用对应制造体系；配件用于幻想乡专用底盘。"
 touhou_tank_optional_demonforce_secondary_aa:0 "捕风妖舌副座"
 touhou_tank_optional_demonforce_secondary_aa_short:0 "捕风妖舌副座"
 touhou_tank_optional_demonforce_secondary_aa_desc:0 "弹射妖舌和硬羽拦截低空目标，对空收益有限且事故率高。\n\n研发条件：（§Y$gwtank_chassis$§! 或 §Y$basic_light_tank_chassis$§! 或 §Y$improved_light_tank_chassis$§! 或 §Y$advanced_light_tank_chassis$§! 或 §Y$basic_medium_tank_chassis$§! 或 §Y$improved_medium_tank_chassis$§! 或 §Y$advanced_medium_tank_chassis$§! 或 §Y$main_battle_tank_chassis$§! 或 §Y$basic_heavy_tank_chassis$§! 或 §Y$improved_heavy_tank_chassis$§! 或 §Y$advanced_heavy_tank_chassis$§! 或 §Y$super_heavy_tank_chassis$§!）、§Y$gwtank_chassis$§!、§Y$interwar_antiair$§!。须采用对应制造体系；配件用于幻想乡专用底盘。"
 touhou_tank_optional_demonforce_secondary_flame:0 "灼息妖腺"
 touhou_tank_optional_demonforce_secondary_flame_short:0 "灼息妖腺"
 touhou_tank_optional_demonforce_secondary_flame_desc:0 "妖腺喷出灼热吐息，软攻较高，但伤及活体结构，可靠性下降。\n\n研发条件：（§Y$gwtank_chassis$§! 或 §Y$basic_light_tank_chassis$§! 或 §Y$improved_light_tank_chassis$§! 或 §Y$advanced_light_tank_chassis$§! 或 §Y$basic_medium_tank_chassis$§! 或 §Y$improved_medium_tank_chassis$§! 或 §Y$advanced_medium_tank_chassis$§! 或 §Y$main_battle_tank_chassis$§! 或 §Y$basic_heavy_tank_chassis$§! 或 §Y$improved_heavy_tank_chassis$§! 或 §Y$advanced_heavy_tank_chassis$§! 或 §Y$super_heavy_tank_chassis$§!）、§Y$gwtank_chassis$§!、§Y$tech_engineers$§!。须采用对应制造体系；配件用于幻想乡专用底盘。"
 touhou_tank_optional_demonforce_coax:0 "口器喷刺管"
 touhou_tank_optional_demonforce_coax_short:0 "口器喷刺管"
 touhou_tank_optional_demonforce_coax_desc:0 "口器喷出少量妖刺，软攻略增，维护和能耗不划算。\n\n研发条件：（§Y$gwtank_chassis$§! 或 §Y$basic_light_tank_chassis$§! 或 §Y$improved_light_tank_chassis$§! 或 §Y$advanced_light_tank_chassis$§! 或 §Y$basic_medium_tank_chassis$§! 或 §Y$improved_medium_tank_chassis$§! 或 §Y$advanced_medium_tank_chassis$§! 或 §Y$main_battle_tank_chassis$§! 或 §Y$basic_heavy_tank_chassis$§! 或 §Y$improved_heavy_tank_chassis$§! 或 §Y$advanced_heavy_tank_chassis$§! 或 §Y$super_heavy_tank_chassis$§!）、§Y$gwtank_chassis$§!、§Y$infantry_weapons$§!。须采用对应制造体系；配件用于幻想乡专用底盘。"
 touhou_tank_optional_demonforce_stabilizer:0 "猎食瞄准复眼"
 touhou_tank_optional_demonforce_stabilizer_short:0 "猎食瞄准复眼"
 touhou_tank_optional_demonforce_stabilizer_desc:0 "多枚复眼协调咬击方向，提高突破和少量硬攻，内部拥挤影响稳定性。\n\n研发条件：（§Y$gwtank_chassis$§! 或 §Y$basic_light_tank_chassis$§! 或 §Y$improved_light_tank_chassis$§! 或 §Y$advanced_light_tank_chassis$§! 或 §Y$basic_medium_tank_chassis$§! 或 §Y$improved_medium_tank_chassis$§! 或 §Y$advanced_medium_tank_chassis$§! 或 §Y$main_battle_tank_chassis$§! 或 §Y$basic_heavy_tank_chassis$§! 或 §Y$improved_heavy_tank_chassis$§! 或 §Y$advanced_heavy_tank_chassis$§! 或 §Y$super_heavy_tank_chassis$§!）、§Y$gwtank_chassis$§!、§Y$improved_computing_machine$§!。须采用对应制造体系；配件用于幻想乡专用底盘。"
 touhou_tank_optional_demonforce_sloped_shield:0 "石化妖皮层"
 touhou_tank_optional_demonforce_sloped_shield_short:0 "石化妖皮层"
 touhou_tank_optional_demonforce_sloped_shield_desc:0 "局部妖皮硬化，装甲提升明显，僵硬皮层削弱速度与可靠性。\n\n研发条件：（§Y$gwtank_chassis$§! 或 §Y$basic_light_tank_chassis$§! 或 §Y$improved_light_tank_chassis$§! 或 §Y$advanced_light_tank_chassis$§! 或 §Y$basic_medium_tank_chassis$§! 或 §Y$improved_medium_tank_chassis$§! 或 §Y$advanced_medium_tank_chassis$§! 或 §Y$main_battle_tank_chassis$§! 或 §Y$basic_heavy_tank_chassis$§! 或 §Y$improved_heavy_tank_chassis$§! 或 §Y$advanced_heavy_tank_chassis$§! 或 §Y$super_heavy_tank_chassis$§!）、§Y$gwtank_chassis$§!。须采用对应制造体系；配件用于幻想乡专用底盘。"
 touhou_tank_optional_demonforce_skirts:0 "侧生护体骨刺"
