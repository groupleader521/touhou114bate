 touhou_tank_demonforce_heavy_1_engine:0 "妖兽·妖化动力核"
 touhou_tank_demonforce_heavy_1_engine_short:0 "妖兽·妖化动力核"
 touhou_tank_demonforce_heavy_1_engine_desc:0 "妖化动力系统。数值由原型号最低公共速度、可靠性、能耗和造价拆分；武器安装架承担额外能耗。\n\n研发条件：§Y$basic_heavy_tank_chassis$§!、§Y$gwtank_chassis$§!。须采用对应制造体系；配件用于幻想乡专用底盘。"
 touhou_tank_demonforce_heavy_1_suspension:0 "妖兽·妖化机动关节"
 touhou_tank_demonforce_heavy_1_suspension_short:0 "妖兽·妖化机动关节"
 touhou_tank_demonforce_heavy_1_suspension_desc:0 "以关节、步态稳定或履带支撑承担公共机动能力，可与原版悬挂互换。\n\n研发条件：§Y$basic_heavy_tank_chassis$§!、§Y$gwtank_chassis$§!。须采用对应制造体系；配件用于幻想乡专用底盘。"
 touhou_tank_demonforce_heavy_1_armor:0 "妖兽·妖化护甲"
 touhou_tank_demonforce_heavy_1_armor_short:0 "妖兽·妖化护甲"
 touhou_tank_demonforce_heavy_1_armor_desc:0 "人偶炼金外壳、妖兽角质外甲或鬼铸护甲；与底盘共同承担所有角色的公共防护。\n\n研发条件：§Y$basic_heavy_tank_chassis$§!、§Y$gwtank_chassis$§!。须采用对应制造体系；配件用于幻想乡专用底盘。"
 touhou_tank_demonforce_heavy_1_control:0 "妖兽·妖化操控座"
 touhou_tank_demonforce_heavy_1_control_short:0 "妖兽·妖化操控座"
 touhou_tank_demonforce_heavy_1_control_desc:0 "人偶指令节点、妖力协调座或鬼族战斗操控座。保持原版炮塔尺寸和武器兼容规则。\n\n研发条件：§Y$basic_heavy_tank_chassis$§!、§Y$gwtank_chassis$§!。须采用对应制造体系；配件用于幻想乡专用底盘。"
 touhou_tank_weapon_demonforce_heavy_tank_equipment_1:0 "妖兽·近战重击武器组"
 touhou_tank_weapon_demonforce_heavy_tank_equipment_1_short:0 "妖兽·近战重击武器组"
 touhou_tank_weapon_demonforce_heavy_tank_equipment_1_desc:0 "完整主武器与专用安装架。攻击、穿甲、防空来自原型号；安装架的遮蔽、指令、能耗和成本差额使原预设保持原有成品数值。\n\n研发条件：§Y$basic_heavy_tank_chassis$§!、§Y$gwtank_chassis$§!。须采用对应制造体系；配件用于幻想乡专用底盘。"
