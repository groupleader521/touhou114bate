 touhou_tank_magic_light_2_engine:0 "上海级改良型·人偶动力核"
 touhou_tank_magic_light_2_engine_short:0 "上海级改良型·人偶动力核"
 touhou_tank_magic_light_2_engine_desc:0 "人偶动力系统。数值由原型号最低公共速度、可靠性、能耗和造价拆分；武器安装架承担额外能耗。\n\n研发条件：§Y$improved_light_tank_chassis$§!、§Y$gwtank_chassis$§!。须采用对应制造体系；配件用于幻想乡专用底盘。"
