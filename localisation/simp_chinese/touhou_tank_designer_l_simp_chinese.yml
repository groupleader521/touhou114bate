 touhou_tank_optional_magic_toolbox_desc:0 "小人偶梳理缠绕咒线，可靠性和突破收益很小，仍需供能。\n\n研发条件：（§Y$gwtank_chassis$§! 或 §Y$basic_light_tank_chassis$§! 或 §Y$improved_light_tank_chassis$§! 或 §Y$advanced_light_tank_chassis$§! 或 §Y$basic_medium_tank_chassis$§! 或 §Y$improved_medium_tank_chassis$§! 或 §Y$advanced_medium_tank_chassis$§! 或 §Y$main_battle_tank_chassis$§! 或 §Y$basic_heavy_tank_chassis$§! 或 §Y$improved_heavy_tank_chassis$§! 或 §Y$advanced_heavy_tank_chassis$§! 或 §Y$super_heavy_tank_chassis$§!）、§Y$gwtank_chassis$§!。须采用对应制造体系；配件用于幻想乡专用底盘。"
 touhou_tank_optional_magic_signal_flags:0 "弹幕舞步谱架"
