 touhou_tank_optional_wakan_secondary_flame_desc:0 "持续轮换火行御札产生近距焰流，增加软攻，但损失速度并提高能耗。\n\n研发条件：（§Y$gwtank_chassis$§! 或 §Y$basic_light_tank_chassis$§! 或 §Y$improved_light_tank_chassis$§! 或 §Y$advanced_light_tank_chassis$§! 或 §Y$basic_medium_tank_chassis$§! 或 §Y$improved_medium_tank_chassis$§! 或 §Y$advanced_medium_tank_chassis$§! 或 §Y$main_battle_tank_chassis$§! 或 §Y$basic_heavy_tank_chassis$§! 或 §Y$improved_heavy_tank_chassis$§! 或 §Y$advanced_heavy_tank_chassis$§! 或 §Y$super_heavy_tank_chassis$§!）、§Y$gwtank_chassis$§!、§Y$tech_engineers$§!。须采用对应制造体系；配件用于幻想乡专用底盘。"
 touhou_tank_optional_wakan_coax:0 "贴身驱邪札"
