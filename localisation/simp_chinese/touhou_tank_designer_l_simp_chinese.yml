 touhou_tank_optional_magic_dozer_desc:0 "小人偶协助整理阵地，堑壕收益有限；携带人偶牺牲速度。\n\n研发条件：（§Y$gwtank_chassis$§! 或 §Y$basic_light_tank_chassis$§! 或 §Y$improved_light_tank_chassis$§! 或 §Y$advanced_light_tank_chassis$§! 或 §Y$basic_medium_tank_chassis$§! 或 §Y$improved_medium_tank_chassis$§! 或 §Y$advanced_medium_tank_chassis$§! 或 §Y$main_battle_tank_chassis$§! 或 §Y$basic_heavy_tank_chassis$§! 或 §Y$improved_heavy_tank_chassis$§! 或 §Y$advanced_heavy_tank_chassis$§! 或 §Y$super_heavy_tank_chassis$§!）、§Y$gwtank_chassis$§!、§Y$tech_engineers2$§!。须采用对应制造体系；配件用于幻想乡专用底盘。"
 touhou_tank_optional_magic_fuel_drum:0 "压缩魔力瓶"
