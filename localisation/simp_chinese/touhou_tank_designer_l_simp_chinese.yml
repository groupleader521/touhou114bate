 touhou_tank_optional_demonforce_skirts_desc:0 "侧生骨刺提高装甲并补充近敌火力，负担降低可靠性。\n\n研发条件：（§Y$gwtank_chassis$§! 或 §Y$basic_light_tank_chassis$§! 或 §Y$improved_light_tank_chassis$§! 或 §Y$advanced_light_tank_chassis$§! 或 §Y$basic_medium_tank_chassis$§! 或 §Y$improved_medium_tank_chassis$§! 或 §Y$advanced_medium_tank_chassis$§! 或 §Y$main_battle_tank_chassis$§! 或 §Y$basic_heavy_tank_chassis$§! 或 §Y$improved_heavy_tank_chassis$§! 或 §Y$advanced_heavy_tank_chassis$§! 或 §Y$super_heavy_tank_chassis$§!）、§Y$gwtank_chassis$§!、§Y$armor_tech_2$§!。须采用对应制造体系；配件用于幻想乡专用底盘。"
 touhou_tank_optional_demonforce_extra_magazine:0 "狂化营养腺"
 touhou_tank_optional_demonforce_extra_magazine_short:0 "狂化营养腺"
 touhou_tank_optional_demonforce_extra_magazine_desc:0 "刺激攻击性组织生长，提高软攻，失控风险和补充消耗明显。\n\n研发条件：（§Y$gwtank_chassis$§! 或 §Y$basic_light_tank_chassis$§! 或 §Y$improved_light_tank_chassis$§! 或 §Y$advanced_light_tank_chassis$§! 或 §Y$basic_medium_tank_chassis$§! 或 §Y$improved_medium_tank_chassis$§! 或 §Y$advanced_medium_tank_chassis$§! 或 §Y$main_battle_tank_chassis$§! 或 §Y$basic_heavy_tank_chassis$§! 或 §Y$improved_heavy_tank_chassis$§! 或 §Y$advanced_heavy_tank_chassis$§! 或 §Y$super_heavy_tank_chassis$§!）、§Y$gwtank_chassis$§!。须采用对应制造体系；配件用于幻想乡专用底盘。"
 touhou_tank_optional_demonforce_dozer:0 "掘穴前肢"
 touhou_tank_optional_demonforce_dozer_short:0 "掘穴前肢"
 touhou_tank_optional_demonforce_dozer_desc:0 "前肢便于掘穴和近敌扑击，增加堑壕与少量软攻，维护不便。\n\n研发条件：（§Y$gwtank_chassis$§! 或 §Y$basic_light_tank_chassis$§! 或 §Y$improved_light_tank_chassis$§! 或 §Y$advanced_light_tank_chassis$§! 或 §Y$basic_medium_tank_chassis$§! 或 §Y$improved_medium_tank_chassis$§! 或 §Y$advanced_medium_tank_chassis$§! 或 §Y$main_battle_tank_chassis$§! 或 §Y$basic_heavy_tank_chassis$§! 或 §Y$improved_heavy_tank_chassis$§! 或 §Y$advanced_heavy_tank_chassis$§! 或 §Y$super_heavy_tank_chassis$§!）、§Y$gwtank_chassis$§!、§Y$tech_engineers2$§!。须采用对应制造体系；配件用于幻想乡专用底盘。"
 touhou_tank_optional_demonforce_fuel_drum:0 "休眠妖力胃囊"
 touhou_tank_optional_demonforce_fuel_drum_short:0 "休眠妖力胃囊"
 touhou_tank_optional_demonforce_fuel_drum_desc:0 "胃囊储备妖力，但维持活性会增加日常消耗和结构负担。\n\n研发条件：（§Y$gwtank_chassis$§! 或 §Y$basic_light_tank_chassis$§! 或 §Y$improved_light_tank_chassis$§! 或 §Y$advanced_light_tank_chassis$§! 或 §Y$basic_medium_tank_chassis$§! 或 §Y$improved_medium_tank_chassis$§! 或 §Y$advanced_medium_tank_chassis$§! 或 §Y$main_battle_tank_chassis$§! 或 §Y$basic_heavy_tank_chassis$§! 或 §Y$improved_heavy_tank_chassis$§! 或 §Y$advanced_heavy_tank_chassis$§! 或 §Y$super_heavy_tank_chassis$§!）、§Y$gwtank_chassis$§!。须采用对应制造体系；配件用于幻想乡专用底盘。"
 touhou_tank_optional_demonforce_toolbox:0 "寄生清洁虫盒"
 touhou_tank_optional_demonforce_toolbox_short:0 "寄生清洁虫盒"
 touhou_tank_optional_demonforce_toolbox_desc:0 "清洁虫清除少量寄生组织，以很小稳定性收益换取额外能耗。\n\n研发条件：（§Y$gwtank_chassis$§! 或 §Y$basic_light_tank_chassis$§! 或 §Y$improved_light_tank_chassis$§! 或 §Y$advanced_light_tank_chassis$§! 或 §Y$basic_medium_tank_chassis$§! 或 §Y$improved_medium_tank_chassis$§! 或 §Y$advanced_medium_tank_chassis$§! 或 §Y$main_battle_tank_chassis$§! 或 §Y$basic_heavy_tank_chassis$§! 或 §Y$improved_heavy_tank_chassis$§! 或 §Y$advanced_heavy_tank_chassis$§! 或 §Y$super_heavy_tank_chassis$§!）、§Y$gwtank_chassis$§!。须采用对应制造体系；配件用于幻想乡专用底盘。"
 touhou_tank_optional_demonforce_signal_flags:0 "威吓兽牙旗"
 touhou_tank_optional_demonforce_signal_flags_short:0 "威吓兽牙旗"
 touhou_tank_optional_demonforce_signal_flags_desc:0 "兽牙旗激发短暂攻击冲动，软攻略增而防御略减。\n\n研发条件：（§Y$gwtank_chassis$§! 或 §Y$basic_light_tank_chassis$§! 或 §Y$improved_light_tank_chassis$§! 或 §Y$advanced_light_tank_chassis$§! 或 §Y$basic_medium_tank_chassis$§! 或 §Y$improved_medium_tank_chassis$§! 或 §Y$advanced_medium_tank_chassis$§! 或 §Y$main_battle_tank_chassis$§! 或 §Y$basic_heavy_tank_chassis$§! 或 §Y$improved_heavy_tank_chassis$§! 或 §Y$advanced_heavy_tank_chassis$§! 或 §Y$super_heavy_tank_chassis$§!）、§Y$gwtank_chassis$§!。须采用对应制造体系；配件用于幻想乡专用底盘。"
 touhou_tank_optional_demonforce_ornamental_armor:0 "炫耀用第二对角"
 touhou_tank_optional_demonforce_ornamental_armor_short:0 "炫耀用第二对角"
 touhou_tank_optional_demonforce_ornamental_armor_desc:0 "第二对角主要用于威吓，少量软攻无法抵消负重。\n\n研发条件：（§Y$gwtank_chassis$§! 或 §Y$basic_light_tank_chassis$§! 或 §Y$improved_light_tank_chassis$§! 或 §Y$advanced_light_tank_chassis$§! 或 §Y$basic_medium_tank_chassis$§! 或 §Y$improved_medium_tank_chassis$§! 或 §Y$advanced_medium_tank_chassis$§! 或 §Y$main_battle_tank_chassis$§! 或 §Y$basic_heavy_tank_chassis$§! 或 §Y$improved_heavy_tank_chassis$§! 或 §Y$advanced_heavy_tank_chassis$§! 或 §Y$super_heavy_tank_chassis$§!）、§Y$gwtank_chassis$§!。须采用对应制造体系；配件用于幻想乡专用底盘。"
 touhou_tank_optional_demonforce_parade_lights:0 "发光妖苔培养盘"
 touhou_tank_optional_demonforce_parade_lights_short:0 "发光妖苔培养盘"
 touhou_tank_optional_demonforce_parade_lights_desc:0 "妖苔帮助识别伙伴，微小协同收益伴随维持消耗。\n\n研发条件：（§Y$gwtank_chassis$§! 或 §Y$basic_light_tank_chassis$§! 或 §Y$improved_light_tank_chassis$§! 或 §Y$advanced_light_tank_chassis$§! 或 §Y$basic_medium_tank_chassis$§! 或 §Y$improved_medium_tank_chassis$§! 或 §Y$advanced_medium_tank_chassis$§! 或 §Y$main_battle_tank_chassis$§! 或 §Y$basic_heavy_tank_chassis$§! 或 §Y$improved_heavy_tank_chassis$§! 或 §Y$advanced_heavy_tank_chassis$§! 或 §Y$super_heavy_tank_chassis$§!）、§Y$gwtank_chassis$§!。须采用对应制造体系；配件用于幻想乡专用底盘。"
 touhou_tank_optional_demonforce_crew_comfort:0 "御兽磨牙石"
 touhou_tank_optional_demonforce_crew_comfort_short:0 "御兽磨牙石"
 touhou_tank_optional_demonforce_crew_comfort_desc:0 "磨牙石降低一点躁动，也稍微削弱攻击欲望。\n\n研发条件：（§Y$gwtank_chassis$§! 或 §Y$basic_light_tank_chassis$§! 或 §Y$improved_light_tank_chassis$§! 或 §Y$advanced_light_tank_chassis$§! 或 §Y$basic_medium_tank_chassis$§! 或 §Y$improved_medium_tank_chassis$§! 或 §Y$advanced_medium_tank_chassis$§! 或 §Y$main_battle_tank_chassis$§! 或 §Y$basic_heavy_tank_chassis$§! 或 §Y$improved_heavy_tank_chassis$§! 或 §Y$advanced_heavy_tank_chassis$§! 或 §Y$super_heavy_tank_chassis$§!）、§Y$gwtank_chassis$§!。须采用对应制造体系；配件用于幻想乡专用底盘。"
 touhou_tank_optional_demonforce_spare_tracks:0 "休眠替换肢囊"
 touhou_tank_optional_demonforce_spare_tracks_short:0 "休眠替换肢囊"
 touhou_tank_optional_demonforce_spare_tracks_desc:0 "休眠肢体用于维护，可靠性收益有限，维持组织需要能量。\n\n研发条件：（§Y$gwtank_chassis$§! 或 §Y$basic_light_tank_chassis$§! 或 §Y$improved_light_tank_chassis$§! 或 §Y$advanced_light_tank_chassis$§! 或 §Y$basic_medium_tank_chassis$§! 或 §Y$improved_medium_tank_chassis$§! 或 §Y$advanced_medium_tank_chassis$§! 或 §Y$main_battle_tank_chassis$§! 或 §Y$basic_heavy_tank_chassis$§! 或 §Y$improved_heavy_tank_chassis$§! 或 §Y$advanced_heavy_tank_chassis$§! 或 §Y$super_heavy_tank_chassis$§!）、§Y$gwtank_chassis$§!。须采用对应制造体系；配件用于幻想乡专用底盘。"
 touhou_tank_optional_demonforce_emergency_battery:0 "狂猎催化腺"
 touhou_tank_optional_demonforce_emergency_battery_short:0 "狂猎催化腺"
 touhou_tank_optional_demonforce_emergency_battery_desc:0 "催化腺驱动妖兽高速扑击，速度和突破增加，但极不稳定。\n\n研发条件：（§Y$gwtank_chassis$§! 或 §Y$basic_light_tank_chassis$§! 或 §Y$improved_light_tank_chassis$§! 或 §Y$advanced_light_tank_chassis$§! 或 §Y$basic_medium_tank_chassis$§! 或 §Y$improved_medium_tank_chassis$§! 或 §Y$advanced_medium_tank_chassis$§! 或 §Y$main_battle_tank_chassis$§! 或 §Y$basic_heavy_tank_chassis$§! 或 §Y$improved_heavy_tank_chassis$§! 或 §Y$advanced_heavy_tank_chassis$§! 或 §Y$super_heavy_tank_chassis$§!）、§Y$gwtank_chassis$§!、§Y$engine_tech_1$§!。须采用对应制造体系；配件用于幻想乡专用底盘。"
 touhou_tank_optional_demonforce_cooling_fins:0 "妖血换热腮"
 touhou_tank_optional_demonforce_cooling_fins_short:0 "妖血换热腮"
 touhou_tank_optional_demonforce_cooling_fins_desc:0 "换热组织改善稳定性，额外供养提高能耗。\n\n研发条件：（§Y$gwtank_chassis$§! 或 §Y$basic_light_tank_chassis$§! 或 §Y$improved_light_tank_chassis$§! 或 §Y$advanced_light_tank_chassis$§! 或 §Y$basic_medium_tank_chassis$§! 或 §Y$improved_medium_tank_chassis$§! 或 §Y$advanced_medium_tank_chassis$§! 或 §Y$main_battle_tank_chassis$§! 或 §Y$basic_heavy_tank_chassis$§! 或 §Y$improved_heavy_tank_chassis$§! 或 §Y$advanced_heavy_tank_chassis$§! 或 §Y$super_heavy_tank_chassis$§!）、§Y$gwtank_chassis$§!。须采用对应制造体系；配件用于幻想乡专用底盘。"
 touhou_tank_optional_demonforce_seals:0 "蜕皮收纳囊"
 touhou_tank_optional_demonforce_seals_short:0 "蜕皮收纳囊"
 touhou_tank_optional_demonforce_seals_desc:0 "保留旧皮保护局部结构，防护很少，收纳囊妨碍机动。\n\n研发条件：（§Y$gwtank_chassis$§! 或 §Y$basic_light_tank_chassis$§! 或 §Y$improved_light_tank_chassis$§! 或 §Y$advanced_light_tank_chassis$§! 或 §Y$basic_medium_tank_chassis$§! 或 §Y$improved_medium_tank_chassis$§! 或 §Y$advanced_medium_tank_chassis$§! 或 §Y$main_battle_tank_chassis$§! 或 §Y$basic_heavy_tank_chassis$§! 或 §Y$improved_heavy_tank_chassis$§! 或 §Y$advanced_heavy_tank_chassis$§! 或 §Y$super_heavy_tank_chassis$§!）、§Y$gwtank_chassis$§!。须采用对应制造体系；配件用于幻想乡专用底盘。"
