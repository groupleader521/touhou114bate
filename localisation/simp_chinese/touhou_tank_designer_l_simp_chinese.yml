 touhou_tank_optional_magic_signal_flags_desc:0 "按谱表协调表演式弹幕，少量软攻和突破难以抵消空间开销。\n\n研发条件：（§Y$gwtank_chassis$§! 或 §Y$basic_light_tank_chassis$§! 或 §Y$improved_light_tank_chassis$§! 或 §Y$advanced_light_tank_chassis$§! 或 §Y$basic_medium_tank_chassis$§! 或 §Y$improved_medium_tank_chassis$§! 或 §Y$advanced_medium_tank_chassis$§! 或 §Y$main_battle_tank_chassis$§! 或 §Y$basic_heavy_tank_chassis$§! 或 §Y$improved_heavy_tank_chassis$§! 或 §Y$advanced_heavy_tank_chassis$§! 或 §Y$super_heavy_tank_chassis$§!）、§Y$gwtank_chassis$§!。须采用对应制造体系；配件用于幻想乡专用底盘。"
 touhou_tank_optional_magic_ornamental_armor:0 "操偶音乐盒"
