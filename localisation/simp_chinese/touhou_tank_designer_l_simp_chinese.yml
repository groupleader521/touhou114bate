 touhou_tank_magic_light_2_suspension_short:0 "上海级改良型·人偶机动关节"
 touhou_tank_magic_light_2_suspension_desc:0 "以关节、步态稳定或履带支撑承担公共机动能力，可与原版悬挂互换。\n\n研发条件：§Y$improved_light_tank_chassis$§!、§Y$gwtank_chassis$§!。须采用对应制造体系；配件用于幻想乡专用底盘。"
