 touhou_tank_optional_demonforce_secondary_mg_desc:0 "寄生飞羽向近敌反复散射，软攻较高，持续生长消耗妖力并影响可靠性。\n\n研发条件：（§Y$gwtank_chassis$§! 或 §Y$basic_light_tank_chassis$§! 或 §Y$improved_light_tank_chassis$§! 或 §Y$advanced_light_tank_chassis$§! 或 §Y$basic_medium_tank_chassis$§! 或 §Y$improved_medium_tank_chassis$§! 或 §Y$advanced_medium_tank_chassis$§! 或 §Y$main_battle_tank_chassis$§! 或 §Y$basic_heavy_tank_chassis$§! 或 §Y$improved_heavy_tank_chassis$§! 或 §Y$advanced_heavy_tank_chassis$§! 或 §Y$super_heavy_tank_chassis$§!）、§Y$gwtank_chassis$§!、§Y$infantry_weapons$§!。须采用对应制造体系；配件用于幻想乡专用底盘。"
 touhou_tank_optional_demonforce_secondary_cannon:0 "伸缩妖角副炮"
