l_simp_chinese:
 touhou_debug_decisions:0 "幻想乡调试工具"
 touhou_debug_decisions_desc:0 "仅在调试模式下显示的测试决议，用于快速调整领土、改革、角色和工业。"
 touhou_debug_annex_gensokyo:0 "接管幻想乡全部地区"
 touhou_debug_annex_gensokyo_desc:0 "将所有标记为幻想乡地区的州转交给本国。"
 touhou_debug_instant_reform:0 "立即完成全部改革"
 touhou_debug_instant_reform_desc:0 "立即执行社会、政府、科研、军事和工业改革的完成效果。"
 touhou_debug_core_all:0 "将全部领土设为核心"
 touhou_debug_core_all_desc:0 "将本国当前拥有的所有州设为本国核心领土。"
 touhou_debug_annex_afr:0 "接管非洲全部地区"
 touhou_debug_annex_afr_desc:0 "将非洲大陆上的所有州转交给本国。"
 touhou_debug_remove_elec:0 "移除电子企业（按特质）"
 touhou_debug_remove_elec_desc:0 "移除本国所有具有电子企业特质的顾问或企业。"
 touhou_debug_remove_elec2:0 "移除通用电子企业"
 touhou_debug_remove_elec2_desc:0 "移除本国当前的通用电子企业。"
 touhou_debug_remove_elec3:0 "将电子企业替换为工业企业"
 touhou_debug_remove_elec3_desc:0 "将本国的通用电子企业替换为通用工业企业。"
 touhou_debug_get_boss_characters:0 "启用魔界首领角色"
 touhou_debug_get_boss_characters_desc:0 "执行魔界首领角色配置，包括神绮的领导人身份及相关政治设置。"
 touhou_debug_become_boss:0 "初始化为魔界首领势力"
 touhou_debug_summon_makai:0 "召唤魔界"
 touhou_debug_summon_makai_desc:0 "立即召唤魔界并触发“主的降临”，跳过邀请和360天准备期。优先选择南非地区符合条件的AI国家，否则选择其他非盟友、非本国傀儡的AI国家。立即配置神绮、军队、工业及魔界阵营；魔界已经出现时不可重复召唤。"
 touhou_debug_become_boss_desc:0 "执行魔界首领初始化：切换国家外观、获得全球核心，并配置角色、科技、军队和工业。"
 touhou_debug_add_offsite_factories:0 "增加场外民用与军用工厂"
 touhou_debug_add_offsite_factories_desc:0 "为本国增加5000座场外民用工厂和5000座场外军用工厂。每次执行都会再次增加。"
