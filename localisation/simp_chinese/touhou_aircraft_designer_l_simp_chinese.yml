 touhou_air_demonforce_small_0_engine_desc:0 "飞行附魔、御风推进或妖翼动力。性能由原型号的公共速度、机动、能耗与成本拆分；推力采用对应原版发动机的基准。\n\n研发条件：§Y$iw_small_airframe$§!。须采用对应制造体系；配件用于幻想乡专用机体。"
