 touhou_air_demonforce_small_0_protection_desc:0 "附魔护罩、护身符阵或妖羽护甲；承担公共防护与稳定性。\n\n研发条件：§Y$iw_small_airframe$§!。须采用对应制造体系；配件用于幻想乡专用机体。"
 touhou_air_demonforce_small_0_range:0 "有翼·妖力续航器官"
