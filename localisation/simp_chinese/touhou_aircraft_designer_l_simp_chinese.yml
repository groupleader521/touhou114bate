 touhou_air_demonforce_small_0_range_desc:0 "魔力储能、灵力导引或妖力续航；承担公共航程和操控。\n\n研发条件：§Y$iw_small_airframe$§!。须采用对应制造体系；配件用于幻想乡专用机体。"
