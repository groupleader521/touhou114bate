l_simp_chinese:
 makai_infantry_equipment_1:0 "魔界·步兵装备 I型"
 makai_infantry_equipment_1_short:0 "魔界·步兵装备 I型"
 makai_infantry_equipment_1_desc:0 "个人和部队使用的步兵武器，以及士兵所需的其他装备。"
 makai_artillery_equipment_1:0 "魔界·牵引式火炮"
 makai_artillery_equipment_1_short:0 "魔界·牵引式火炮"
 makai_artillery_equipment_1_desc:0 "火炮是指如加农炮和榴弹炮一般需由班组操作的大口径武器，可以将弹药发射至远超个人武器有效射程的地方。"
 makai_anti_air_equipment_1:0 "魔界·牵引式防空炮"
 makai_anti_air_equipment_1_short:0 "魔界·牵引式防空炮"
 makai_anti_air_equipment_1_desc:0 "防空炮主要的设计目的是用来击落敌方的飞机，但其高射速的火力同样可以有效地打击地面目标。"
 makai_anti_tank_equipment_1:0 "魔界·牵引式反坦克炮"
 makai_anti_tank_equipment_1_short:0 "魔界·牵引式反坦克炮"
 makai_anti_tank_equipment_1_desc:0 "发射穿甲弹药以击毁坦克与其他坚硬目标的直射火炮。"
 makai_support_equipment_1:0 "魔界·支援装备"
 makai_support_equipment_1_short:0 "魔界·支援装备"
 makai_support_equipment_1_desc:0 "用于支援部队作战的无线电台、吉普车、浮桥和其他装备。"
 makai_motorized_equipment_1:0 "魔界·卡车"
 makai_motorized_equipment_1_short:0 "魔界·卡车"
 makai_motorized_equipment_1_desc:0 "摩托化是陆军机械化的第一步。民用卡车可以很容易地被用来运输士兵、牵引火炮以及输送装备和补给。这极大地提高了步兵的战略机动能力，使其不再依赖于步行。"
 makai_fighter_equipment_1:0 "魔界·战斗机 I型"
 makai_fighter_equipment_1_short:0 "魔界·战斗机 I型"
 makai_fighter_equipment_1_desc:0 "随着星形发动机、单翼设计及全金属外壳的引入，轻机身亦发生了革命。此种设计为我们制造首架现代战斗机的尝试。"
 makai_cv_fighter_equipment_1:0 "魔界·舰载战斗机 I型"
 makai_cv_fighter_equipment_1_short:0 "魔界·舰载战斗机 I型"
 makai_cv_fighter_equipment_1_desc:0 "一种早期战斗机，改造为可从航母起飞降落。"
 makai_cas_equipment_1:0 "魔界·近距支援机 I型"
 makai_cas_equipment_1_short:0 "魔界·近距支援机 I型"
 makai_cas_equipment_1_desc:0 "我们的密接支援理论学说要求一款可进行精确范围攻击的飞行器。此种飞机的可用载荷较大型的战略轰炸机要小，可在低空扫射及俯冲轰炸时伺机攻击摧毁小型目标。"
 makai_cv_cas_equipment_1:0 "魔界·舰载近距支援机 I型"
 makai_cv_cas_equipment_1_short:0 "魔界·舰载近距支援机 I型"
 makai_cv_cas_equipment_1_desc:0 "一种早期近距支援机，改造为可从航母起飞降落。"
 makai_nav_bomber_equipment_1:0 "魔界·海军轰炸机 I型"
 makai_nav_bomber_equipment_1_short:0 "魔界·海军轰炸机 I型"
 makai_nav_bomber_equipment_1_desc:0 "海军飞机对于在接下来的十年中面对海军武器，比如潜艇地位的提升等的新发展至关重要。拥有作为俯冲轰炸机及侦察机的水上飞机将被使用。"
 makai_cv_nav_bomber_equipment_1:0 "魔界·舰载海军轰炸机 I型"
 makai_cv_nav_bomber_equipment_1_short:0 "魔界·舰载海军轰炸机 I型"
 makai_cv_nav_bomber_equipment_1_desc:0 "一种早期海军轰炸机，改造为可从航母起飞降落。"
 makai_heavy_fighter_equipment_1:0 "魔界·重型战斗机 I型"
 makai_heavy_fighter_equipment_1_short:0 "魔界·重型战斗机 I型"
 makai_heavy_fighter_equipment_1_desc:0 "我们的轰炸机任务往返时需要护航保护，以免遭遇敌军战机。为提供护航，我们必须开发一款有着轰炸机航程的战斗机。无可避免，这种飞机较轻型战斗机更加庞大、缓慢、灵敏度更差，但能够携带相当数量的武装。"
 makai_tac_bomber_equipment_1:0 "魔界·战术轰炸机 I型"
 makai_tac_bomber_equipment_1_short:0 "魔界·战术轰炸机 I型"
 makai_tac_bomber_equipment_1_desc:0 "中型轰炸机的定位是多面手，能快速、可靠地完成一系列任务。双引擎、相对轻的重量，可继续使用多年。"
 makai_strat_bomber_equipment_1:0 "魔界·战略轰炸机 I型"
 makai_strat_bomber_equipment_1_short:0 "魔界·战略轰炸机 I型"
 makai_strat_bomber_equipment_1_desc:0 "大战得来的经验及之后的研究均表明，轰炸敌方军事目标及其主要城市将赢得下次战争。至少，我们需要一款能执行此种任务的轰炸机。其需要飞行高度高、航速快，并需要携带大量载荷。此种设计要求大型机身、多引擎。同时还需具有一定的防御能力。"
 makai_destroyer_4:0 "魔界·驱逐舰 IV型"
 makai_destroyer_4_short:0 "魔界·驱逐舰 IV型"
 makai_destroyer_4_desc:0 "现代驱逐舰必须拥有多种不同的索敌装备，新型的深弹投放系统以及与以前的驱逐舰相比更大的吨位。"
 makai_light_cruiser_4:0 "魔界·轻巡洋舰 IV型"
 makai_light_cruiser_4_short:0 "魔界·轻巡洋舰 IV型"
 makai_light_cruiser_4_desc:0 "由于战术中常常被用于保护其他大型船只，现代轻巡洋舰可以摆脱过去的种种限制并专心应对来自空中的威胁。"
 makai_heavy_cruiser_4:0 "魔界·重巡洋舰 IV型"
 makai_heavy_cruiser_4_short:0 "魔界·重巡洋舰 IV型"
 makai_heavy_cruiser_4_desc:0 "这些重巡洋舰的最终型号往往更长、更大也更重，它们还装备有高射速的速射武器。"
 makai_battleship_4:0 "魔界·战列舰 IV型"
 makai_battleship_4_short:0 "魔界·战列舰 IV型"
 makai_battleship_4_desc:0 "各国海军都在思考战列舰还会面对什么重大威胁。最终，人们发现强大的武装和防空火力显得比从前任何时候都更为重要。"
 makai_carrier_4:0 "魔界·航空母舰 IV型"
 makai_carrier_4_short:0 "魔界·航空母舰 IV型"
 makai_carrier_4_desc:0 "随着海军条约被越来越多的国家所无视，我们现在可以建造能携带前所未有的数量的飞机来确保制空权的航空母舰了。"
 makai_submarine_4:0 "魔界·潜艇 IV型"
 makai_submarine_4_short:0 "魔界·潜艇 IV型"
 makai_submarine_4_desc:0 "现代潜艇有着更深的测试潜深和更为优化的布局。根据战场上得到的经验，人们还为它们安装了更加合理的武器以及引擎。"
 makai_super_heavy_tank_equipment_1:0 "魔界·超重型坦克"
 makai_super_heavy_tank_equipment_1_short:0 "魔界·超重型坦克"
 makai_super_heavy_tank_equipment_1_desc:0 "超重型坦克是重型坦克概念的演化。更多更厚的装甲也让他们的车身重量在软土地和部分桥梁上通行时遇到严重问题。"
 makai_super_heavy_tank_destroyer_equipment_1:0 "魔界·超重型自行反坦克炮"
 makai_super_heavy_tank_destroyer_equipment_1_short:0 "魔界·超重型自行反坦克炮"
 makai_super_heavy_tank_destroyer_equipment_1_desc:0 "一种移除了炮塔并以固定安装形式搭载了更大型火炮的超重型坦克底盘。"
 makai_super_heavy_tank_artillery_equipment_1:0 "魔界·超重型自行火炮"
 makai_super_heavy_tank_artillery_equipment_1_short:0 "魔界·超重型自行火炮"
 makai_super_heavy_tank_artillery_equipment_1_desc:0 "安装在超重型底盘上的巨型火炮。"
 makai_super_heavy_tank_aa_equipment_1:0 "魔界·超重型自行防空炮"
 makai_super_heavy_tank_aa_equipment_1_short:0 "魔界·超重型自行防空炮"
 makai_super_heavy_tank_aa_equipment_1_desc:0 "超重型坦克底盘装以防空火炮。"
 makai_fighter_equipment_2:0 "魔界·战斗机 II型"
 makai_fighter_equipment_2_short:0 "魔界·战斗机 II型"
 makai_fighter_equipment_2_desc:0 "战斗机取得了令人震惊的进展，同样，我们要继续整合技术及既有理念上的革新。我们的新战机设计需要同时满足高速、高海拔高性能及尽可能长的航程。此外，还需要全副武装。"
 makai_cv_fighter_equipment_2:0 "魔界·舰载战斗机 II型"
 makai_cv_fighter_equipment_2_short:0 "魔界·舰载战斗机 II型"
 makai_cv_fighter_equipment_2_desc:0 "一种改良战斗机，改造为可从航母起飞降落。"
 makai_cas_equipment_2:0 "魔界·近距支援机 II型"
 makai_cas_equipment_2_short:0 "魔界·近距支援机 II型"
 makai_cas_equipment_2_desc:0 "早期战争经验告诉我们，近距支援机在敌机及地面火力的攻击下的存活率取决于更快的航速、更好的装甲及更佳的机动性。此种次世代地面攻击机亦将使用更大的炸弹、火炮及机枪以对其目标造成更大伤害。"
 makai_cv_cas_equipment_2:0 "魔界·舰载近距支援机 II型"
 makai_cv_cas_equipment_2_short:0 "魔界·舰载近距支援机 II型"
 makai_cv_cas_equipment_2_desc:0 "一种改良近距支援机，改造为可从航母起飞降落。"
 makai_nav_bomber_equipment_2:0 "魔界·海军轰炸机 II型"
 makai_nav_bomber_equipment_2_short:0 "魔界·海军轰炸机 II型"
 makai_nav_bomber_equipment_2_desc:0 "新的引擎技术及空气动力学改进的设计将大大提升海军飞机的速度及俯冲轰炸能力。"
 makai_cv_nav_bomber_equipment_2:0 "魔界·舰载海军轰炸机 II型"
 makai_cv_nav_bomber_equipment_2_short:0 "魔界·舰载海军轰炸机 II型"
 makai_cv_nav_bomber_equipment_2_desc:0 "一种改良海军轰炸机，改造为可从航母起飞降落。"
 makai_heavy_fighter_equipment_2:0 "魔界·重型战斗机 II型"
 makai_heavy_fighter_equipment_2_short:0 "魔界·重型战斗机 II型"
 makai_heavy_fighter_equipment_2_desc:0 "战争教会了我们，我们现有的重型战机在轻巧的战机面前极其脆弱，但因为它的重武装，它在拦截敌方轰炸机时表现甚好。这次改良将注重于提升对敌机甚至地面目标的攻击能力。其航速和航程亦将提升。"
 makai_tac_bomber_equipment_2:0 "魔界·战术轰炸机 II型"
 makai_tac_bomber_equipment_2_short:0 "魔界·战术轰炸机 II型"
 makai_tac_bomber_equipment_2_desc:0 "更重的战术轰炸机能增加其航程、载荷及航速，同时保持飞机执行多重任务的能力。"
 makai_strat_bomber_equipment_2:0 "魔界·战略轰炸机 II型"
 makai_strat_bomber_equipment_2_short:0 "魔界·战略轰炸机 II型"
 makai_strat_bomber_equipment_2_desc:0 "轰炸被证明能有效遏制敌方进行战争的能力。更多防御武器及更高的航速可使新型轰炸机免于坠毁，同时增加其载荷及航程，使得其更加有效。"
 makai_infantry_equipment_2:0 "魔界·步兵装备 II型"
 makai_infantry_equipment_2_short:0 "魔界·步兵装备 II型"
 makai_infantry_equipment_2_desc:0 "个人和部队使用的步兵武器，以及士兵所需的其他装备。更现代化的增加了大量的冲锋枪和反坦克步枪。"
 makai_artillery_equipment_2:0 "魔界·改进型火炮"
 makai_artillery_equipment_2_short:0 "魔界·改进型火炮"
 makai_artillery_equipment_2_desc:0 "新榴弹炮的设计利用新的液压反冲装置和更长的炮管。"
 makai_anti_air_equipment_2:0 "魔界·改进型防空炮"
 makai_anti_air_equipment_2_short:0 "魔界·改进型防空炮"
 makai_anti_air_equipment_2_desc:0 "使用更强炮弹和炮管的防空火炮可以瞄准高空飞行的飞机。"
 makai_anti_tank_equipment_2:0 "魔界·改进型反坦克炮"
 makai_anti_tank_equipment_2_short:0 "魔界·改进型反坦克炮"
 makai_anti_tank_equipment_2_desc:0 "大口径火炮用于打击更厚的倾斜装甲防护坦克。"
 makai_mechanized_equipment_2:0 "魔界·机械化装备 II型"
 makai_mechanized_equipment_2_short:0 "魔界·机械化装备 II型"
 makai_mechanized_equipment_2_desc:0 "机械化步兵是装备有装甲运兵车和步兵战车用于运输和战斗的步兵部队。机械化步兵与摩托化步兵的区别在于这些装甲车辆比起摩托化步兵的软面皮轮车辆（卡车或吉普等）一定程度上为步兵提供了免于敌方火力的保护。"
 makai_modern_tank_equipment_1:0 "魔界·现代坦克"
 makai_modern_tank_equipment_1_short:0 "魔界·现代坦克"
 makai_modern_tank_equipment_1_desc:0 "现代坦克是灵活的多用途装甲战斗载具，结合了重型坦克的火力与中型坦克的机动，预示着主战坦克的发展方向。"
 makai_modern_tank_destroyer_equipment_1:0 "魔界·现代自行反坦克炮"
 makai_modern_tank_destroyer_equipment_1_short:0 "魔界·现代自行反坦克炮"
 makai_modern_tank_destroyer_equipment_1_desc:0 "现代自行反坦克炮是早期轻型和中型自行反坦克炮的进化，更注重机动性和隐蔽性而非厚重的装甲。"
 makai_modern_tank_artillery_equipment_1:0 "魔界·现代自行火炮"
 makai_modern_tank_artillery_equipment_1_short:0 "魔界·现代自行火炮"
 makai_modern_tank_artillery_equipment_1_desc:0 "现代自行火炮车表面看起来像坦克，但他们的轻装甲过薄以至于难以在交战的直接火力下生存。但它们能保护乘员免于弹片和轻武器的袭击。"
 makai_modern_tank_aa_equipment_1:0 "魔界·现代自行防空炮"
 makai_modern_tank_aa_equipment_1_short:0 "魔界·现代自行防空炮"
 makai_modern_tank_aa_equipment_1_desc:0 "凭借导弹与速射炮的组合，现代自行防空炮对敌方航空器构成了致命威胁。"
 makai_fighter_equipment_3:0 "魔界·战斗机 III型"
 makai_fighter_equipment_3_short:0 "魔界·战斗机 III型"
 makai_fighter_equipment_3_desc:0 "前代战机证明了其价值，任何更佳的设计所带来的进步都不可忽视。该种飞机将成为活塞发动机驱动战机的顶峰，拥有卓越动力、高度灵活、致命武装及良好航程。"
 makai_cv_fighter_equipment_3:0 "魔界·舰载战斗机 III型"
 makai_cv_fighter_equipment_3_short:0 "魔界·舰载战斗机 III型"
 makai_cv_fighter_equipment_3_desc:0 "一种先进战斗机，改造为可从航母起飞降落。"
 makai_cas_equipment_3:0 "魔界·近距支援机 III型"
 makai_cas_equipment_3_short:0 "魔界·近距支援机 III型"
 makai_cas_equipment_3_desc:0 "目标的防空能力及敌军截击机前所未有的进展使得近距支援机需要进一步发展。新款设计同时拥有增大的引擎动力、改进机身以增强俯冲能力及防护能力，还有更大的载荷。"
 makai_cv_cas_equipment_3:0 "魔界·舰载近距支援机 III型"
 makai_cv_cas_equipment_3_short:0 "魔界·舰载近距支援机 III型"
 makai_cv_cas_equipment_3_desc:0 "一种先进近距支援机，改造为可从航母起飞降落。"
 makai_nav_bomber_equipment_3:0 "魔界·海军轰炸机 III型"
 makai_nav_bomber_equipment_3_short:0 "魔界·海军轰炸机 III型"
 makai_nav_bomber_equipment_3_desc:0 "全金属设计及强力的减速板使得海军飞行学更加复杂。但未来的飞机将需要更多乘员以操作这些复杂的系统。"
 makai_cv_nav_bomber_equipment_3:0 "魔界·舰载海军轰炸机 III型"
 makai_cv_nav_bomber_equipment_3_short:0 "魔界·舰载海军轰炸机 III型"
 makai_cv_nav_bomber_equipment_3_desc:0 "一种先进海军轰炸机，改造为可从航母起飞降落。"
 makai_heavy_fighter_equipment_3:0 "魔界·重型战斗机 III型"
 makai_heavy_fighter_equipment_3_short:0 "魔界·重型战斗机 III型"
 makai_heavy_fighter_equipment_3_desc:0 "虽然我们的重型战机熟练于执行各种任务，我们必须考虑一种新的设计，以提升其相对敌方战机的灵敏性，同时让其继续拦截越来越快、防御越来越严密的敌方轰炸机。"
 makai_tac_bomber_equipment_3:0 "魔界·战术轰炸机 III型"
 makai_tac_bomber_equipment_3_short:0 "魔界·战术轰炸机 III型"
 makai_tac_bomber_equipment_3_desc:0 "从战斗机发展中得到一大堆好处，非传统材料及造型可使新型飞机成为目前航速最快、表现最好的双引擎飞机。"
 makai_strat_bomber_equipment_3:0 "魔界·战略轰炸机 III型"
 makai_strat_bomber_equipment_3_short:0 "魔界·战略轰炸机 III型"
 makai_strat_bomber_equipment_3_desc:0 "为避免轰炸机损失于敌方战机及地面火力，下一代飞机将在极高海拔飞行。同时机身将更大以承载庞大的载荷及更多的燃料，提升航程。"
 makai_infantry_equipment_3:0 "魔界·步兵装备 III型"
 makai_infantry_equipment_3_short:0 "魔界·步兵装备 III型"
 makai_infantry_equipment_3_desc:0 "个人和部队使用的步兵武器，以及士兵所需的其他装备。更现代化的增加了大量的冲锋枪和反坦克步枪。"
 makai_artillery_equipment_3:0 "魔界·先进型火炮"
 makai_artillery_equipment_3_short:0 "魔界·先进型火炮"
 makai_artillery_equipment_3_desc:0 "重量更轻的火炮能够被分解运输，为那些以前难以获得火炮支持的地区提供火力支持。"
 makai_jet_fighter_equipment_2:0 "魔界·喷气式战斗机 II型"
 makai_jet_fighter_equipment_2_short:0 "魔界·喷气式战斗机 II型"
 makai_jet_fighter_equipment_2_desc:0 "新的掠翼设计及更轻的材料选择将使得我们进一步扩展革命性的喷气式战斗机的航程及速度。"
 makai_jet_tac_bomber_equipment_2:0 "魔界·喷气式战术轰炸机 II型"
 makai_jet_tac_bomber_equipment_2_short:0 "魔界·喷气式战术轰炸机 II型"
 makai_jet_tac_bomber_equipment_2_desc:0 "由于航速不足，新一代喷气式轰炸机更加注重海拔及航程，携带更多载荷，并在洲际任务中进行侦查。"
 makai_jet_strat_bomber_equipment_1:0 "魔界·喷气式战略轰炸机 I型"
 makai_jet_strat_bomber_equipment_1_short:0 "魔界·喷气式战略轰炸机 I型"
 makai_jet_strat_bomber_equipment_1_desc:0 "多孔喷射引擎使得新型飞机拥有史无前例的航速，同时能保持携带大量载荷及长航程。此种飞机为大型杀伤武器的新时代而建造。"
 makai_anti_air_equipment_3:0 "魔界·先进型防空炮"
 makai_anti_air_equipment_3_short:0 "魔界·先进型防空炮"
 makai_anti_air_equipment_3_desc:0 "高级防空炮有着更大的覆盖范围和设计容量，能够打击最快最新的敌机。"
 makai_anti_tank_equipment_3:0 "魔界·先进型反坦克炮"
 makai_anti_tank_equipment_3_short:0 "魔界·先进型反坦克炮"
 makai_anti_tank_equipment_3_desc:0 "高级反坦克炮使用多种新型弹药技术与更快地枪口射速相结合，能够应对敌人可能的开发的任何装甲。"
